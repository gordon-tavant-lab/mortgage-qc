/* ---------------------------------- Data ---------------------------------- */
const CATEGORY_COLORS = {

  "Application Verification": { dot: "bg-indigo-500", ring: "ring-indigo-200", text: "text-indigo-700", bg: "bg-indigo-50", border: "border-indigo-200", node: "#4f46e5" },

const FIELD_CATALOG = [

  { id: "gift_funds_used", label: "Gift funds used (Y/N)", kind: "predicate" },
  { id: "note_signed", label: "Note — signed", kind: "predicate" },

const OPERATORS_BY_KIND = {
  predicate: ["is_present", "is_true", "is_false"],
  ratio_threshold: ["<=", "<", ">=", ">", "between"],
  agree_categorical: ["equals", "not_equals"],

const BLOCKS = [

  { id: "income-verification", name: "Income Verification", category: "Income Verification", count: 111 },
  { id: "underwriting-review", name: "Underwriting Review", category: "Underwriting", count: 102 },
  { id: "credit-liabilities", name: "Credit / Liabilities Review", category: "Credit / Liabilities", count: 84 },
  { id: "asset-verification", name: "Asset Verification", category: "Asset Verification", count: 75,
    checks: [
      { id: "chk-gift-donor", name: "Gift Funds — Donor Relationship Documented", severity: "CRITICAL", kind: "predicate",
        field: "gift_letter_donor_relationship", operator: "is_present", value: null,
        appliesIf: [{ field: "gift_funds_used", operator: "equals", value: "true" }] },
      { id: "chk-reserves", name: "Reserves Meet Minimum Months Required", severity: "WARNING", kind: "ratio_threshold",
        field: "reserves_months", operator: ">=", value: "2", appliesIf: [] },
    ] },
  { id: "closing-docs", name: "Closing Documents Review", category: "Closing Documents", count: 34 },
  { id: "loan-docs", name: "Loan Documents Review", category: "Loan Documents", count: 33 },
  { id: "insurance-review", name: "Insurance Review", category: "Insurance Review", count: 28 },
  { id: "application-verification", name: "Application Verification", category: "Application Verification", count: 19 },
  { id: "compliance-review", name: "Compliance Review (ATR/QM)", category: "Compliance", count: 6 },

const DEFAULT_BOUND = ["property-appraisal", "income-verification", "underwriting-review", "credit-liabilities", "asset-verification", "closing-docs", "loan-docs", "insurance-review", "application-verification"];

/* ---------------------------------- Small building blocks ---------------------------------- */
function SeverityBadge({ s }) {
  const map = {
    CRITICAL: "bg-rose-50 text-rose-700 border-rose-200",
    WARNING: "bg-amber-50 text-amber-700 border-amber-200",
    INFO: "bg-blue-50 text-blue-700 border-blue-200",
  };
  return <span className={`text-[10px] uppercase font-mono px-1.5 py-0.5 rounded border font-bold tracking-wide ${map[s]}`}>{s}</span>;
}

function Toggle({ on, onClick, size = "md" }) {
  const dims = size === "sm" ? "w-8 h-4.5" : "w-10 h-5.5";
  return (
    <button onClick={onClick} className={`relative ${dims} rounded-full transition-colors duration-200 shrink-0 ${on ? "bg-blue-600" : "bg-slate-300"}`}>
      <span className={`absolute top-0.5 left-0.5 bg-white rounded-full shadow transition-transform duration-200 ${size === "sm" ? "w-3.5 h-3.5" : "w-4.5 h-4.5"} ${on ? (size === "sm" ? "translate-x-3.5" : "translate-x-4.5") : "translate-x-0"}`} />
    </button>
  );
}

function KindBadge({ kind }) {
  return <span className="text-[10px] font-mono uppercase tracking-wide px-1.5 py-0.5 rounded bg-slate-800 text-slate-200">{kind}</span>;
}

/* ---------------------------------- Route Topology Preview ---------------------------------- */
function TopologyPreview({ boundBlocks }) {
  const width = 860;
  const nodeW = 168, nodeH = 40, gapY = 14;
  const startX = 150, midX = width / 2 - nodeW / 2, endX = width - 150 - nodeW;
  const totalH = Math.max(boundBlocks.length * (nodeH + gapY) - gapY, nodeH);
  const svgH = totalH + 80;

  return (
    <div className="relative bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-800">
        <div className="flex items-center gap-2 text-slate-300">
          <IconEye className="w-3.5 h-3.5" />
          <span className="text-[11px] font-mono uppercase tracking-wider">Live topology preview — read only, generated from the list</span>
        </div>
        <span className="text-[10px] font-mono text-slate-500">{boundBlocks.length} block{boundBlocks.length !== 1 ? "s" : ""} in parallel</span>
      </div>
      <div className="overflow-x-auto">
        <svg width={width} height={svgH} className="block mx-auto">
          {/* intake node */}
          <g>
            <rect x={10} y={svgH/2 - 20} width={110} height={40} rx={8} fill="#1e293b" stroke="#334155" />
            <text x={65} y={svgH/2 + 5} textAnchor="middle" fontSize="11" fontFamily="JetBrains Mono, monospace" fill="#94a3b8">INTAKE</text>
          </g>
          {/* fan-out joint */}
          <circle cx={130} cy={svgH/2} r={5} fill="#475569" />
          {/* report node */}
          <g>
            <rect x={width - 130} y={svgH/2 - 20} width={110} height={40} rx={8} fill="#1e293b" stroke="#334155" />
            <text x={width - 75} y={svgH/2 + 5} textAnchor="middle" fontSize="11" fontFamily="JetBrains Mono, monospace" fill="#94a3b8">REPORT</text>
          </g>
          {/* fan-in joint */}
          <circle cx={width - 140} cy={svgH/2} r={5} fill="#475569" />

          {boundBlocks.map((b, i) => {
            const y = 40 + i * (nodeH + gapY);
            const color = (CATEGORY_COLORS[b.category] || {}).node || "#64748b";
            return (
              <g key={b.id}>
                <path d={`M135,${svgH/2} C ${midX-40},${svgH/2} ${midX-40},${y+nodeH/2} ${midX},${y+nodeH/2}`} stroke="#334155" strokeWidth="1.5" fill="none" className="edge-draw" />
                <path d={`M${midX+nodeW},${y+nodeH/2} C ${midX+nodeW+40},${y+nodeH/2} ${width-145-40},${svgH/2} ${width-145},${svgH/2}`} stroke="#334155" strokeWidth="1.5" fill="none" className="edge-draw" />
                <rect x={midX} y={y} width={nodeW} height={nodeH} rx={7} fill="#0f172a" stroke={color} strokeWidth="1.5" className="fade-in" />
                <circle cx={midX + 14} cy={y + nodeH/2} r={4} fill={color} />
                <text x={midX + 26} y={y + nodeH/2 + 4} fontSize="10.5" fontFamily="Inter, sans-serif" fontWeight="600" fill="#e2e8f0">
                  {b.name.length > 22 ? b.name.slice(0, 21) + "…" : b.name}
                </text>
              </g>
            );
          })}
          {boundBlocks.length === 0 && (
            <text x={width/2} y={svgH/2} textAnchor="middle" fontSize="12" fontFamily="JetBrains Mono, monospace" fill="#475569">no blocks bound — toggle some on the left</text>
          )}
        </svg>
      </div>
      <div className="px-4 py-2 border-t border-slate-800 flex items-center gap-2 text-slate-500">
        <IconLock className="w-3 h-3" />
        <span className="text-[10.5px] font-mono">Structure only — no internals shown here. Wiring is derived from the block list, never hand-drawn.</span>
      </div>
    </div>
  );
}

/* ---------------------------------- Applies-If precondition builder ---------------------------------- */
function AppliesIfBuilder({ rows }) {
  if (!rows || rows.length === 0) {
    return <div className="text-[11px] text-slate-400 italic px-3 py-2 bg-slate-50 rounded border border-dashed border-slate-200">Always applies — no precondition set.</div>;
  }
  return (
    <div className="space-y-2">
      {rows.map((r, i) => (
        <div key={i} className="flex items-center gap-2">
          {i > 0 && <span className="text-[10px] font-mono font-bold text-slate-400 w-7 text-center">AND</span>}
          {i === 0 && <span className="w-7" />}
          <div className="flex-1 flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5">
            <span className="text-xs font-mono text-slate-700">{r.field}</span>
            <span className="text-[10px] font-mono text-blue-600 font-bold">{r.operator}</span>
            <span className="text-xs font-mono text-slate-900 font-bold">{r.value}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

function plainEnglish(check) {
  const fieldLabel = (id) => (FIELD_CATALOG.find(f => f.id === id) || {}).label || id;
  const opWord = { is_present: "is present", is_true: "is Yes", is_false: "is No", ">=": "is at least", "<=": "is at most", ">": "is more than", "<": "is less than", equals: "equals" };
  let s = "";
  if (check.appliesIf && check.appliesIf.length > 0) {
    s += "This check only runs when " + check.appliesIf.map(r => `${fieldLabel(r.field)} ${r.value === "true" ? "is Yes" : r.value === "false" ? "is No" : opWord[r.operator] + " " + r.value}`).join(" and ") + ". ";
  }
  s += `When it runs, it requires: ${fieldLabel(check.field)} ${opWord[check.operator] || check.operator}${check.value ? " " + check.value : ""}.`;
  return s;
}

/* ---------------------------------- NL Assistant → structured fields (per-field confirm) ---------------------------------- */
function NlAssistant({ onProposal }) {
  const [prompt, setPrompt] = useState("Make sure the donor's relationship to the borrower is documented whenever gift funds are used.");
  const [thinking, setThinking] = useState(false);

  const handleSuggest = () => {
    setThinking(true);
    setTimeout(() => {
      setThinking(false);
      onProposal({
        field: { value: "gift_letter_donor_relationship", label: "Gift letter — donor relationship stated" },
        operator: { value: "is_present", label: "is present" },
        appliesIf: { value: [{ field: "gift_funds_used", operator: "equals", value: "true" }], label: "Gift funds used = Yes" },
        severity: { value: "CRITICAL", label: "Critical" },
      });
    }, 1100);
  };

  return (
    <div className="rounded-lg border border-violet-200 bg-violet-50/50 p-3 space-y-2.5">
      <div className="flex items-center gap-1.5 text-violet-700 font-bold text-xs">
        <IconSparkles className="w-3.5 h-3.5" />
        <span>Describe the check in plain English</span>
      </div>
      <textarea value={prompt} onChange={e => setPrompt(e.target.value)} rows={2}
        className="w-full text-xs font-sans p-2.5 border border-violet-200 rounded-lg bg-white focus:ring-1 focus:ring-violet-400 focus:outline-none resize-none" />
      <div className="flex items-center justify-between">
        <p className="text-[10.5px] text-violet-500 leading-snug max-w-[70%]">Proposes into the fields on the right — one at a time, for you to confirm. Never edits the runnable logic directly.</p>
        <button onClick={handleSuggest} disabled={thinking}
          className="shrink-0 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 disabled:opacity-60 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5">
          <IconWand className="w-3.5 h-3.5" />
          {thinking ? "Reading the rule…" : "Suggest fields"}
        </button>
      </div>
    </div>
  );
}

function ProposedChip({ onConfirm, onEdit }) {
  return (
    <div className="fade-in flex items-center gap-1.5 mt-1">
      <span className="text-[10px] font-mono font-bold text-violet-600 bg-violet-100 px-1.5 py-0.5 rounded flex items-center gap-1">
        <IconSparkles className="w-2.5 h-2.5" /> AI suggested
      </span>
      <button onClick={onConfirm} className="text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded hover:bg-emerald-100 flex items-center gap-0.5">
        <IconCheck className="w-2.5 h-2.5" /> Confirm
      </button>
      <button onClick={onEdit} className="text-[10px] font-bold text-slate-500 hover:text-slate-700 px-1 flex items-center gap-0.5">
        <IconPencil className="w-2.5 h-2.5" /> Edit
      </button>
    </div>
  );
}

/* ---------------------------------- Structured Check Editor ---------------------------------- */
function CheckEditor({ check }) {
  const [field, setField] = useState(check.field);
  const [operator, setOperator] = useState(check.operator);
  const [value, setValue] = useState(check.value || "");
  const [appliesIf, setAppliesIf] = useState(check.appliesIf || []);
  const [severity, setSeverity] = useState(check.severity);
  const [pending, setPending] = useState({}); // which fields have an unconfirmed AI proposal

  const kind = (FIELD_CATALOG.find(f => f.id === field) || {}).kind || check.kind;
  const operators = OPERATORS_BY_KIND[kind] || [];

  const applyProposal = (proposal) => {
    // stagger the reveal so the SME sees each field land individually, not a blob
    const steps = [
      () => { setField(proposal.field.value); setPending(p => ({ ...p, field: true })); },
      () => { setOperator(proposal.operator.value); setPending(p => ({ ...p, operator: true })); },
      () => { setAppliesIf(proposal.appliesIf.value); setPending(p => ({ ...p, appliesIf: true })); },
      () => { setSeverity(proposal.severity.value); setPending(p => ({ ...p, severity: true })); },
    ];
    steps.forEach((fn, i) => setTimeout(fn, i * 380));
  };

  const confirm = (key) => setPending(p => { const n = { ...p }; delete n[key]; return n; });

  const liveCheck = { field, operator, value, appliesIf };

  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="px-5 py-4 border-b border-slate-100 flex items-start justify-between">
        <div>
          <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">{check.name} <SeverityBadge s={severity} /></h3>
          <p className="text-xs text-slate-500 mt-1">Structured gate — every choice below is constrained to a real, catalog-resolvable value. Nothing here is free text.</p>
        </div>
        <KindBadge kind={kind} />
      </div>

      <div className="p-5 grid grid-cols-1 lg:grid-cols-2 gap-6">
        {/* left: structured controls */}
        <div className="space-y-4">
          <NlAssistant onProposal={applyProposal} />

          <div>
            <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold flex items-center gap-1">
              Field <span className="text-slate-300">·</span> <span className="normal-case font-sans font-normal text-slate-400">from the signed field catalog</span>
            </label>
            <select value={field} onChange={e => setField(e.target.value)}
              className={`w-full mt-1 text-sm p-2 border rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 ${pending.field ? "border-violet-300 suggest-pulse" : "border-slate-200"}`}>
              {FIELD_CATALOG.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
            </select>
            {pending.field && <ProposedChip onConfirm={() => confirm("field")} onEdit={() => confirm("field")} />}
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Operator</label>
              <select value={operator} onChange={e => setOperator(e.target.value)}
                className={`w-full mt-1 text-sm p-2 border rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 ${pending.operator ? "border-violet-300 suggest-pulse" : "border-slate-200"}`}>
                {operators.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
              {pending.operator && <ProposedChip onConfirm={() => confirm("operator")} onEdit={() => confirm("operator")} />}
            </div>
            <div>
              <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Value / threshold</label>
              <input value={value} onChange={e => setValue(e.target.value)} placeholder={kind === "predicate" ? "n/a" : "e.g. 2"} disabled={kind === "predicate"}
                className="w-full mt-1 text-sm p-2 border border-slate-200 rounded-lg bg-white disabled:bg-slate-50 disabled:text-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500" />
            </div>
          </div>

          <div>
            <div className="flex items-center justify-between">
              <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Applies only when… (precondition)</label>
              <button className="text-[10.5px] text-blue-600 font-semibold flex items-center gap-0.5 hover:text-blue-500">
                <IconPlus className="w-3 h-3" /> Add condition
              </button>
            </div>
            <div className={`mt-1.5 p-1 rounded-lg ${pending.appliesIf ? "ring-1 ring-violet-300 suggest-pulse" : ""}`}>
              <AppliesIfBuilder rows={appliesIf} />
            </div>
            {pending.appliesIf && <ProposedChip onConfirm={() => confirm("appliesIf")} onEdit={() => confirm("appliesIf")} />}
          </div>

          <div>
            <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Severity</label>
            <div className="flex gap-2 mt-1.5">
              {["CRITICAL", "WARNING", "INFO"].map(s => (
                <button key={s} onClick={() => setSeverity(s)}
                  className={`px-2.5 py-1 rounded-lg border text-[11px] font-mono font-bold uppercase transition ${severity === s ? (s === "CRITICAL" ? "bg-rose-600 text-white border-rose-600" : s === "WARNING" ? "bg-amber-500 text-white border-amber-500" : "bg-blue-600 text-white border-blue-600") : "bg-white text-slate-500 border-slate-200 hover:border-slate-300"}`}>
                  {s}
                </button>
              ))}
            </div>
            {pending.severity && <ProposedChip onConfirm={() => confirm("severity")} onEdit={() => confirm("severity")} />}
          </div>
        </div>

        {/* right: plain-english + provenance + never-YAML note */}
        <div className="space-y-4">
          <div className="rounded-lg border border-blue-100 bg-blue-50/60 p-4">
            <div className="text-[10.5px] font-mono uppercase tracking-wider text-blue-600 font-bold mb-1.5">What this reads as, in plain English</div>
            <p className="text-sm text-slate-800 leading-relaxed font-medium">{plainEnglish(liveCheck)}</p>
          </div>

          <div className="rounded-lg border border-slate-200 p-4">
            <div className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold mb-2 flex items-center gap-1.5">
              <IconGitFork className="w-3.5 h-3.5" /> Provenance
            </div>
            <ul className="text-xs text-slate-600 space-y-1.5">
              <li className="flex items-start gap-1.5"><span className="text-slate-300 mt-0.5">—</span> Source: AMQ workbook, row #347, "Post-Closing" sheet</li>
              <li className="flex items-start gap-1.5"><span className="text-slate-300 mt-0.5">—</span> Field resolved against the signed field catalog (v3)</li>
              <li className="flex items-start gap-1.5"><span className="text-slate-300 mt-0.5">—</span> Precondition traced to a quoted span, not invented</li>
            </ul>
          </div>

          <div className="rounded-lg border border-slate-800 bg-slate-900 p-4">
            <div className="text-[10.5px] font-mono uppercase tracking-wider text-slate-400 font-bold mb-1.5 flex items-center gap-1.5">
              <IconLock className="w-3.5 h-3.5" /> What actually gets signed
            </div>
            <p className="text-[11px] text-slate-400 leading-relaxed">
              This screen never edits a formula string, SQL clause, or YAML block directly — every field above is a discrete, human-checkable choice. The compiler turns it into a signed, hashed ruleset once you approve the batch. There is nothing here an SME can rubber-stamp without reading.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------- Block row + list ---------------------------------- */
function BlockRow({ block, wired, onToggle, onOpenChecks, expanded }) {
  const c = CATEGORY_COLORS[block.category] || {};
  return (
    <div className={`border rounded-lg transition-colors ${wired ? `border-slate-200 bg-white` : "border-slate-150 bg-slate-50/40"}`}>
      <div className="p-3 flex items-center gap-3 cursor-pointer" onClick={() => onOpenChecks(block.id)}>
        <span className={`w-2 h-2 rounded-full shrink-0 ${wired ? c.dot : "bg-slate-300"}`} />
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <span className={`text-xs font-bold truncate ${wired ? "text-slate-900" : "text-slate-400"}`}>{block.name}</span>
            {block.checks && <span className="text-[9.5px] font-mono text-violet-500 bg-violet-50 px-1 rounded shrink-0">demo checks</span>}
          </div>
          <span className="text-[10.5px] font-mono text-slate-400">{block.count} question codes</span>
        </div>
        {block.checks && wired && <IconChevron className={`w-3.5 h-3.5 text-slate-400 transition-transform ${expanded ? "rotate-90" : ""}`} />}
        <Toggle on={wired} onClick={(e) => { e.stopPropagation(); onToggle(block.id); }} />
      </div>
    </div>
  );
}

/* ---------------------------------- App ---------------------------------- */
function App() {
  const [bound, setBound] = useState(DEFAULT_BOUND);
  const [openBlockId, setOpenBlockId] = useState("asset-verification");
  const [openCheckId, setOpenCheckId] = useState("chk-gift-donor");

  const toggleBlock = (id) => setBound(b => b.includes(id) ? b.filter(x => x !== id) : [...b, id]);
  const boundBlocks = useMemo(() => BLOCKS.filter(b => bound.includes(b.id)), [bound]);

  const openBlock = BLOCKS.find(b => b.id === openBlockId);
  const openCheck = openBlock && openBlock.checks && openBlock.checks.find(c => c.id === openCheckId);

  return (
    <div className="min-h-screen">
      {/* top chrome */}
      <div className="bg-slate-900 text-slate-200 border-b border-slate-800">
        <div className="max-w-[1400px] mx-auto px-6 py-3 flex items-center justify-between">
          <div className="flex items-center gap-6">
            <span className="font-display font-bold text-lg tracking-tight text-white">MORTGAGE QC</span>
            <nav className="flex items-center gap-5 text-[13px] font-medium text-slate-400">
              <span className="text-white border-b-2 border-blue-500 pb-3.5 -mb-3.5">Author</span>
              <span className="hover:text-slate-200 cursor-pointer">Apply</span>
              <span className="hover:text-slate-200 cursor-pointer">Output</span>
            </nav>
          </div>
          <div className="flex items-center gap-2 text-[11px] font-mono text-slate-500">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> compile-then-run · v2 concept
          </div>
        </div>
      </div>

      <div className="max-w-[1400px] mx-auto px-6 py-6">
        <div className="mb-5">
          <h1 className="font-display text-2xl font-bold text-slate-900">Routes → Blocks → Checks</h1>
          <p className="text-sm text-slate-500 mt-1 max-w-3xl">
            Compose a QC route by choosing which blocks apply — no wiring, no system prompts. The structure on the right is drawn <em>from</em> your choices; you never draw it yourself.
          </p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          {/* left: route + block list */}
          <div className="lg:col-span-4 space-y-4">
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
              <label className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Route</label>
              <div className="mt-1.5 relative">
                <select className="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white appearance-none">
                  <option>Conventional Purchase — Post-Closing QC</option>
                  <option>FHA Purchase — Post-Closing QC</option>
                  <option>VA Purchase — Post-Closing QC</option>
                </select>
                <IconGitFork className="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" />
              </div>
              <p className="text-[11px] text-slate-400 italic mt-2">"Full QC audit for conventional purchase loans, post-closing."</p>
            </div>

            <button className="w-full bg-white rounded-xl border border-dashed border-blue-200 hover:border-blue-400 hover:bg-blue-50/40 transition p-4 flex items-center gap-3 text-left group">
              <div className="w-9 h-9 rounded-lg bg-blue-50 group-hover:bg-blue-100 flex items-center justify-center shrink-0">
                <IconUpload className="w-4.5 h-4.5 text-blue-600" />
              </div>
              <div className="min-w-0">
                <div className="text-xs font-bold text-slate-800">Import from your AMQ workbook</div>
                <div className="text-[11px] text-slate-500 leading-snug">426 conditions already in your spreadsheet — bring them in and review the diff, instead of building from scratch.</div>
              </div>
            </button>

            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
              <div className="flex items-center justify-between mb-3">
                <span className="text-[10.5px] font-mono uppercase tracking-wider text-slate-450 font-bold">Bound blocks</span>
                <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono font-bold">{bound.length} / {BLOCKS.length}</span>
              </div>
              <div className="space-y-2 max-h-[560px] overflow-y-auto pr-1">
                {BLOCKS.map(b => (
                  <BlockRow key={b.id} block={b} wired={bound.includes(b.id)} onToggle={toggleBlock}
                    expanded={openBlockId === b.id}
                    onOpenChecks={(id) => setOpenBlockId(openBlockId === id ? null : id)} />
                ))}
              </div>
            </div>
          </div>

          {/* right: topology + check editor */}
          <div className="lg:col-span-8 space-y-5">
            <TopologyPreview boundBlocks={boundBlocks} />

            {openBlock && openBlock.checks ? (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="font-display font-bold text-slate-900 flex items-center gap-2">
                    <IconLayers className="w-4.5 h-4.5 text-slate-500" /> {openBlock.name}
                  </h2>
                  <button className="text-xs text-blue-600 hover:text-blue-500 border border-blue-200 hover:border-blue-400 bg-white font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1">
                    <IconPlus className="w-3.5 h-3.5" /> Add check
                  </button>
                </div>

                <div className="space-y-2">
                  {openBlock.checks.map(c => (
                    <div key={c.id} onClick={() => setOpenCheckId(openCheckId === c.id ? null : c.id)}
                      className={`p-3 rounded-lg border cursor-pointer transition ${openCheckId === c.id ? "border-blue-300 bg-blue-50/40" : "border-slate-200 bg-white hover:border-slate-300"}`}>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 min-w-0">
                          <KindBadge kind={c.kind} />
                          <span className="text-sm font-bold text-slate-800 truncate">{c.name}</span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <SeverityBadge s={c.severity} />
                          <IconChevronDown className={`w-3.5 h-3.5 text-slate-400 transition-transform ${openCheckId === c.id ? "rotate-180" : ""}`} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {openCheck && <CheckEditor key={openCheck.id} check={openCheck} />}
              </div>
            ) : (
              <div className="bg-white rounded-xl border border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">
                Select a block on the left to review its checks.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually transform + run the app source with the CLASSIC JSX runtime
  // (avoids @babel/standalone's default automatic runtime, which emits
  // `import ... from "react/jsx-runtime"` — incompatible with the UMD React global here).
  var src = document.getElementById("app-source").textContent;
  var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  var s = document.createElement("script");
  s.textContent = out;
  document.body.appendChild(s);
</script>
</body>
</html>
