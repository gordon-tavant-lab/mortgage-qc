            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanType = 'Conventional' OR Loans.LoanType = 'Portfolio'
            - "Yes, the final 1008 is accurate and complete" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanType = 'Conventional' OR Loans.LoanType = 'Portfolio'
            - "The project review field is incomplete or incorrect" -> EXCEPTION [O-FNM-00715-F] Significance: Major | AOR: Underwriter
              Exception Detail: The project review field is incorrect or incomplete
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanType = 'Conventional' OR Loans.LoanType = 'Portfolio'
            - "The final 1008 is incomplete, incorrect,  or missing" -> EXCEPTION [O-FNM-00715] Significance: Major | AOR: Underwriter
              Exception Detail: The 1008/1077, Uniform Underwriting and Transmittal Summary, or a similar document was incomplete, incorrect or not in the file for this manually underwritten loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanType = 'Conventional' OR Loans.LoanType = 'Portfolio'
            - "The risk assessment field is incomplete or incorrect" -> EXCEPTION [PB-00715] Significance: Major | AOR: Underwriter
              Exception Detail: The risk assessment field is incomplete or incorrect.
        Q98:
          CODE: DATA-POINTS
          TEXT: Have all data points, including ULDD been verified as complete to avoid early check errors/defects?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The credit reference # in EPIC does not match AUS" -> EXCEPTION [Data Points-7] Significance: Major | AOR: Underwriter
              Exception Detail: The credit reference # in EPIC does not match AUS.
            - "Yes, all data points including ULDD have been verified as complete" -> PASS
        Q99:
          CODE: MaterialDisc
          TEXT: Were all material discrepancies identified and the required documentation or commentary provided to address?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Missing the required documentation or commentary addressing the material discrepancies identified" -> EXCEPTION [UW-MatDiscrep/Other] Significance: Critical | AOR: Underwriter
              Exception Detail: All material discrepancies have not been addressed by underwriting
            - "Not Applicable" -> NOT_APPLICABLE
            - "Yes, all material discrepancies have been addressed with proper documentation" -> PASS
            - "Yes, all discrepancies have been addressed" -> PASS
        Q100:
          CODE: O-FNM-15409
          TEXT: Were all QC underwriting documents review requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "All DU messages/conditions not resolved" -> EXCEPTION [O-FNM-50337] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan was underwritten through DU, without all Messages/Approval conditions being satisfactorily resolved and/or did not include supportive documentation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The loan did not close by the Close By Date stated in the DU validation message" -> EXCEPTION [O-FNM-52994] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan did not close by the Close by Date stated in the DU validation message.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC review: DU income/asset validation report ID mismatch &/or verification report expired" -> EXCEPTION [O-FNM-59418] Significance: Critical | AOR: Underwriter
              Exception Detail: As part of the QC review, the loan income or asset validation report ID from the DU validation service did not match the ID captured in the final DU findings report and/or the verification report was expired.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not all information & final loan terms on the closing documents are correct" -> EXCEPTION [O-FNM-50338] Significance: Critical | AOR: Underwriter
              Exception Detail: All of the information or final loan terms on the closing documents were not correct including the settlement statement, Note, Mortgage, Title and/or any additional required closing documentation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Closing conditions were not satisfied by the date of closing" -> EXCEPTION [O-FNM-00824] Significance: Critical | AOR: Underwriter
              Exception Detail: All loan approval conditions required by the underwriter were not satisfied.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all QC underwriting documents review requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q101:
          CODE: O-FRD-15555
          TEXT: Were all additional monthly debt payment-to-income ratio liability evaluation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Business debt(s) not included in DTI or documentation debt(s) is paid by the business is missing" -> EXCEPTION [O-FRD-50021] Significance: Critical | AOR: Underwriter
              Exception Detail: Business debt is reported on the borrower’s personal credit report and is not documented to be paid by the borrower's business; however, the debt is not included in the DTI calculation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Contingent liability without evidence another obligor has made payments for the last 12 months" -> EXCEPTION [O-FRD-00173] Significance: Critical | AOR: Underwriter
              Exception Detail: A contingent liability was excluded from the DTI ratio without all eligibility and documentation requirements being met based on debt type and/or also did not include that a non-interested party other than the borrower has been making timely payments for the most recent 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Housing or DTI ratio exceed the guidelines without a written explanation justifying the decision" -> EXCEPTION [O-FRD-00679] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is manually underwritten and either the housing or debt to income ratio guideline was exceeded without a written explanation justifying the underwriting decision in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Other property owned expenses excluded & no evidence uninterested party made pymts for last 12 mos" -> EXCEPTION [O-FRD-56095] Significance: Critical | AOR: Underwriter
              Exception Detail: Other property owned related expenses were excluded without documenting an uninterested party other than the borrower has been making payments for the most recent 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Solar panels under a lease/power purchase agreement were excluded and documentation of terms not met" -> EXCEPTION [O-FRD-03074] Significance: Critical | AOR: Underwriter
              Exception Detail: Lease payments for solar panels were excluded from the monthly DTI ratio without the lease being provided and/or all specifications not included as required.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Updated credit report revealed impactful additional debts, not re-underwritten to include in DTI" -> EXCEPTION [O-FRD-00821] Significance: Critical | AOR: Underwriter
              Exception Detail: An updated credit report was ordered prior to closing that revealed impactful additional debts and the loan was not re-underwritten to include in the DTI ratio.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all additional monthly debt payment-to-income ratio liability evaluation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q102:
          CODE: PB-Entity
          TEXT: Were all Private Bank Entity Lending Guidelines met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Formation Document (Articles of Organization/Cert of Organization/Cert of Formation) not found" -> EXCEPTION [PB-FormDoc] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in LLC and Formation Document (Articles of Organization/Certificate of Organization/Certificate of Formation)was not found.
            - "A deposit account in the name of Entity/Trust was not established prior to or at closing" -> EXCEPTION [PB-DepAcct] Significance: Critical | AOR: Underwriter
              Exception Detail: A deposit account in the name of Entity/Trust was not established prior to or at closing.
            - "Closed in a borrower structure that is ineligible" -> EXCEPTION [PB-Structure] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in a borrower structure that is ineligible.
            - "Closed in Entity/Trust name and an attorney opinion letter was not found" -> EXCEPTION [PB-Opinion Letter] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in Entity/Trust name and an attorney opinion letter was not found.
            - "Closed in Entity/Trust and Mailing Address for the entity was not found" -> EXCEPTION [PB-MailAddr] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in Entity/Trust and Mailing Address for the entity was not found.
            - "Closed in LLC and Operating Agreement was not found (when applicable)" -> EXCEPTION [PB-OperAgr] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in LLC and Operating Agreement was not found (when applicable).
            - "Evidence of the review by both Legal and Credit is not in GDR" -> EXCEPTION [PB-Review] Significance: Critical | AOR: Underwriter
            - "Closed in name of Entity/Trust and Tax Identification Number for the entity was not found" -> EXCEPTION [PB-TAXID] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in name of Entity/Trust and Tax Identification Number for the entity was not found.
            - "Closed in Trust and Trust Agreement or Trustee Certificate was not found" -> EXCEPTION [PB-Agree&Cert] Significance: Critical | AOR: Underwriter
              Exception Detail: Closed in Trust and Trust Agreement or Trustee Certificate was not found.
            - "Yes" -> PASS

