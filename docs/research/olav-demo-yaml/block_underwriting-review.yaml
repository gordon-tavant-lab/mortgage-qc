block_id: underwriting-review
name: "Underwriting Review"
description: "Comprehensive underwriting review covering AUS findings, conditions satisfaction, risk assessment, compensating factors, and overall loan eligibility determination."
category: underwriting-review
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Underwriting Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (102 questions):
        Q1:
          CODE: O-FRD-15542
          TEXT: Where the mortgage is secured by a second home, were all eligibility requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The location of the subject is unreasonable to function as a 2nd home" -> EXCEPTION [O-FRD-50364] Significance: Critical | AOR: Underwriter
              Exception Detail: The location of the subject is not reasonable to function as a 2nd home.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac' AND Loans.Occupancy = 'Second Home'
            - "2nd home unfit for full time occ &/or unavailable for borr's exclusive use" -> EXCEPTION [O-FRD-50365] Significance: Critical | AOR: Underwriter
              Exception Detail: For a 2nd home, the property is not suitable for year-round occupancy for the borrower's exclusive use and enjoyment or a seasonal limitation was not documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac' AND Loans.Occupancy = 'Second Home'
            - "The subject is a second home that was not underwritten with Loan Product Advisor" -> EXCEPTION [O-FRD-58203] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is a second home that was not underwritten with Loan Product Advisor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac' AND Loans.Occupancy = 'Second Home'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac' AND Loans.Occupancy = 'Second Home'
            - "Yes, all second home eligibility requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac' AND Loans.Occupancy = 'Second Home'
        Q2:
          CODE: O-RHS-15680
          TEXT: Were all total debt ratio calculation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "A 30-day account balance with late payment > 12 months; 5% of the payment is not included in DTI" -> EXCEPTION [O-RHS-02839] Significance: Critical | AOR: Underwriter
              Exception Detail: 5% of the outstanding balance was not used as the monthly payment for a 30-day account when the credit report reflects a late payment in the last 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Alimony/child support/garnishments/other court ordered debts were excluded from DTI" -> EXCEPTION [O-RHS-02840] Significance: Critical | AOR: Underwriter
              Exception Detail: If the applicant is obligated to pay child support, alimony, garnishments or other court-ordered debts, the monthly payment was not included in qualifying.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Borr is in a debt management plan & the monthly counseling plan payment was not included in the DTI" -> EXCEPTION [O-RHS-55313] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower is currently in a debt management plan and, the monthly counseling plan payment was not included in the DTI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The DTI debt ratio was calculated incorrectly and/or the ratio did not meet requirements" -> EXCEPTION [O-RHS-02849] Significance: Critical | AOR: Underwriter
              Exception Detail: The DTI debt ratio was calculated incorrectly and/or the ratio did not meet requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Payment amt used was not the credit report amt & no documentation to support the alternate amt used" -> EXCEPTION [O-RHS-55993] Significance: Critical | AOR: Underwriter
              Exception Detail: A payment amount other than what was listed on the credit report was used for an open debt without documentation supporting an alternate payment amount.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Unsatisfied prior mortgage not in DTI; evidence another obligor has made payments 12 months missing" -> EXCEPTION [O-RHS-02842] Significance: Critical | AOR: Underwriter
              Exception Detail: A previous mortgage liability was disposed of without a release of liability, the payment was not included and the file did not document another party has made the payment for the last 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Late mtg pymts on borr's rental property within 12 mos prior to app & the  full PITIA not in DTI" -> EXCEPTION [O-RHS-55312] Significance: Critical | AOR: Underwriter
              Exception Detail: The credit report reflects late mortgage payments on the borrower's rental property in the 12 months prior to the loan application, and the full mortgage liability and all associated costs were not included in the monthly debts.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Credit report did not report a payment on a revolving account and 5% of the balance was not used" -> EXCEPTION [O-RHS-02838] Significance: Critical | AOR: Underwriter
              Exception Detail: The credit report does not list a monthly payment on a revolving account and 5% of the balance was not used.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Student loan pymt not in DTI as req'd even if paid by another party or in a forgiveness loan program" -> EXCEPTION [O-RHS-55315] Significance: Critical | AOR: Underwriter
              Exception Detail: The student loan payment was not included in the DTI as required, even if paid by another party or is in a forgiveness loan program.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Outstanding student loan credit report/actual documented pymt not used or 0.5% of the balance if $0" -> EXCEPTION [O-RHS-55994] Significance: Critical | AOR: Underwriter
              Exception Detail: Outstanding student loan credit report payment or actual documented not used or 0.5% of the loan balance if the payment amount is zero.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all total debt ratio calculation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q3:
          CODE: O-FRD-15554
          TEXT: Were all monthly debt payment-to-income ratio liability evaluation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "30 day account balance not added to DTI & funds to cover the account, closing/reserves not verified" -> EXCEPTION [O-FRD-50017] Significance: Critical | AOR: Underwriter
              Exception Detail: The outstanding 30 day account balance was not included in the DTI ratio and sufficient funds not verified to cover the account and funds required to close and any reserves requirement.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Child support payments are not in DTI and required documentation is missing" -> EXCEPTION [O-FRD-50019] Significance: Critical | AOR: Underwriter
              Exception Detail: Where the borrower is obliged to make alimony, child support or other maintenance payments with more than 10 months of payments remaining, documentation of the court-ordered or otherwise agreed upon payments was not obtained and/or was not included in the borrower's debt calculation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Monthly payments on debts secured by cryptocurrency was not included in the DTI ratio" -> EXCEPTION [O-FRD-55526] Significance: Critical | AOR: Underwriter
              Exception Detail: Monthly payments on debts secured by cryptocurrency was not included in the debt payment-to-income ratio.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The loan file did not document all payments included in the monthly DTI as applicable" -> EXCEPTION [O-FRD-53802] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan file did not document all payments included in the monthly DTI as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "1.5% of HELOC balance not used & monthly pymt amt not documented in the file or credit report" -> EXCEPTION [O-FRD-53866] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan includes a HELOC and 1.5% of the outstanding HELOC balance not used where the monthly payment amount is not documented in the file or credit report.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Non-Student/IRS installment debt not on credit report or in deferred/forbearance, missing pymt verif" -> EXCEPTION [O-FRD-50023] Significance: Critical | AOR: Underwriter
              Exception Detail: The applicant has an installment debt (non-student or non-IRS) not reported on the credit report, or listed as deferred or in forbearance, and the file did not include documentation verifying the monthly payment amount.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Lease payment(s) excluded from total monthly debt, regardless of lease term remaining" -> EXCEPTION [O-FRD-50027] Significance: Critical | AOR: Underwriter
              Exception Detail: Lease payment exists and the monthly payment was not included in the total monthly debt, regardless of the number of months remaining on the lease.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Asset secured loan is not included in DTI or a copy of the Note reflecting the collateral is missing" -> EXCEPTION [O-FRD-50028] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower has a loan secured by a financial asset and the lender did not obtain a copy of the applicable loan instrument reflecting the borrower's financial asset as collateral for the loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "PITIA of other properties owned by the borrower were not included in DTI as applicable" -> EXCEPTION [O-FRD-50447] Significance: Critical | AOR: Underwriter
              Exception Detail: All applicable PITIA payments for other properties owned by the borrower were not included as required.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Debt paid down or PIF to qualify without the source of funds used being eligible and documented" -> EXCEPTION [O-FRD-55527] Significance: Critical | AOR: Underwriter
              Exception Detail: An existing debt was paid down or paid in full in order to qualify without the source of funds used being eligible and documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Current primary pending sale after Note date-executed sale contract missing" -> EXCEPTION [O-FRD-50448] Significance: Critical | AOR: Underwriter
              Exception Detail: The Borrower's current Primary Residence is a pending sale that will not or did not close before the Note Date of the Mortgage and an executed sales contract for the property pending sale was not provided.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all monthly debt payment-to-income ratio liability evaluation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q4:
          CODE: O-RHS-15681
          TEXT: Were all additional total debt ratio calculation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Account with 30 day late payment in 12 months evident; 5% of the balance not included in DTI" -> EXCEPTION [O-RHS-50006] Significance: Critical | AOR: Underwriter
              Exception Detail: An open 30-day charge account is reflected on the credit report and reflects a late payment(s) within the most recent 12 months, a five percent payment was not included in the monthly obligations.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The full monthly debt of the automobile or expense allowance was not included in the DTI" -> EXCEPTION [O-RHS-02845] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower receives an automobile or expense allowance and the full monthly debt was not included in the DTI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "There is a balloon/deferred payment due in the next 24 mos. that was not included in the DTI" -> EXCEPTION [O-RHS-02847] Significance: Critical | AOR: Underwriter
              Exception Detail: The applicant has a balloon/deferred payment or a payment that will come due in the next 24 months and the payment was not included in the DTI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Business debt on personal credit report omitted w/out evidence debt is paid through a business acct" -> EXCEPTION [O-RHS-50008] Significance: Critical | AOR: Underwriter
              Exception Detail: Business debts reported on the applicants’ personal credit report were omitted from the monthly debt without evidence the debt is paid through a business account.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Contingent liability without evidence another obligor has made payments for the last 12 months" -> EXCEPTION [O-RHS-02843] Significance: Critical | AOR: Underwriter
              Exception Detail: The applicant has a contingent liability and the payment was not included in the DTI and the file did not document that another obligor has made the payment for the last 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Judgment pymt w/ more than 10 pymts left not included with significant impact on mtg repayment" -> EXCEPTION [O-RHS-02844] Significance: Critical | AOR: Underwriter
              Exception Detail: The judgment account payment was not included and there is more than 10 months of repayment left and/or the debt has a significant impact on repayment of the mortgage.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Lease payments not included in the DTI regardless of months remaining to pay on the contract" -> EXCEPTION [O-RHS-52814] Significance: Critical | AOR: Underwriter
              Exception Detail: An auto, solar, energy, and/or other lease payments were not included in the monthly debt regardless of months remaining to pay on the contract.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Installment accounts with more than 10 months remaining was not included in the DTI" -> EXCEPTION [O-RHS-50565] Significance: Critical | AOR: Underwriter
              Exception Detail: The applicant has installment accounts with more than 10 months remaining that was not included in the DTI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Short-term obligation was not included in DTI that will have a significant impact ability to repay" -> EXCEPTION [O-RHS-02846] Significance: Critical | AOR: Underwriter
              Exception Detail: A short-term obligation is reported that will have a significant impact on the applicant's repayment ability without the payment being included in the DTI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Federal and/or State income tax repayment plan payments were not included in the monthly debt" -> EXCEPTION [O-RHS-52813] Significance: Critical | AOR: Underwriter
              Exception Detail: Federal and/or State income tax repayment plan payments were not included in the monthly debt.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all additional total debt ratio calculation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q5:
          CODE: O-FHA-15242
          TEXT: In a purchase transaction, were all requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The subject property is being resold within 90 days of the seller's acquisition" -> EXCEPTION [O-FHA-50654] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject property is being resold within 90 days of the seller's acquisition.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Loan was disapproved & a officer of the company or Sr staff did not agree with the disapproval" -> EXCEPTION [O-FHA-00635] Significance: Critical | AOR: Underwriter
              Exception Detail: The rejected subject loan file did not document the methodology used to review rejected applications, review results and any corrective actions taken as a result of review findings.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Documentation the transaction does not violate HUD's rule against property flipping was not provided" -> EXCEPTION [O-FHA-00596] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is a purchase and the file did not document the seller as the confirmed owner of record
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "All req's where the subject is being resold between 91 -180 days after the last acquisition not met" -> EXCEPTION [O-FHA-50655] Significance: Critical | AOR: Underwriter
              Exception Detail: All requirements not met for the subject property that is being resold between 91 -180 days after the last acquisition.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Yes, all purchase transaction requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
        Q6:
          CODE: O-RHS-15647
          TEXT: Were all general income underwriting requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Income considered for student living away, all req's not met or income used exceeded the first $480" -> EXCEPTION [O-RHS-50543] Significance: Critical | AOR: Underwriter
              Exception Detail: A student who lives away from home has income being considered, without all requirements met and/or the income used exceeded the first $480 of earnings.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Income calculations not provided on Attachment 9-B, Uniform Transmittal Summary or equivalent form" -> EXCEPTION [O-RHS-54269] Significance: Critical | AOR: Underwriter
              Exception Detail: The income calculations were not provided on Attachment 9-B, Uniform Transmittal Summary, or equivalent form.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Annual income used to qualify not from an eligible source" -> EXCEPTION [O-RHS-50541] Significance: Critical | AOR: Underwriter
              Exception Detail: The annual income used to qualify was from an ineligible source to be counted as income.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Tax and insurance estimate used as part of the monthly mortgage payment is not accurate" -> EXCEPTION [O-RHS-02861] Significance: Critical | AOR: Underwriter
              Exception Detail: The amount of escrow funds was not estimated correctly for PITIA as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "One or more income sources were used to qualify that are to be excluded as per RHS guidelines" -> EXCEPTION [O-RHS-02787] Significance: Critical | AOR: Underwriter
              Exception Detail: One or more income sources were used to qualify that are to be excluded as per RHS guidelines.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Annual income calculated incorrectly" -> EXCEPTION [O-RHS-50542] Significance: Critical | AOR: Underwriter
              Exception Detail: The annual income was not calculated correctly.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Income calculation requirements were not met" -> EXCEPTION [O-RHS-50818] Significance: Critical | AOR: Underwriter
              Exception Detail: Income calculation requirements were not met.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Verified changes of income amounts or sources in the ensuing 12 months was not documented" -> EXCEPTION [O-RHS-51843] Significance: Critical | AOR: Underwriter
              Exception Detail: Verified changes of income amounts or sources in the ensuing 12 months was not documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Projected household annual income calculation did not exclude qualified household deductions" -> EXCEPTION [O-RHS-02757] Significance: Critical | AOR: Underwriter
              Exception Detail: When calculating the borrower’s projected household annual income over the next 12 months, the qualified household deductions were not excluded.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The underwriter did not include the eligible income of all adult household members" -> EXCEPTION [O-RHS-02756] Significance: Critical | AOR: Underwriter
              Exception Detail: When calculating the borrower’s projected household annual income over the next 12 months, the eligible income of all adult household members was not included.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The 1008/1077 or other similar document was incomplete, incorrect or not in file" -> EXCEPTION [O-RHS-50901] Significance: Critical | AOR: Underwriter
              Exception Detail: The 1008/1077, Uniform Underwriting and Transmittal Summary, or a similar document was incomplete, incorrect or not in the file for this manually underwritten loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all general income underwriting requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q7:
          CODE: O-FHA-15822
          TEXT: Were all AUS specific underwriting requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "DU Accept however, conditions exist for a downgrade but the loan was not manually underwritten" -> EXCEPTION [O-FHA-02324] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan was not manually underwritten where factors are present that require a downgrade from an Accept recommendation to manual underwriting.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Accept/Ineligible-loan approved without clearing ineligibility issues or document the approval basis" -> EXCEPTION [O-FHA-00613] Significance: Critical | AOR: Underwriter
              Exception Detail: The Feedback Certification/Finding Report shows an Accept/Ineligible recommendation, the reason for ineligibility was not resolved and/or the resolution explanation was not noted in the remarks section of the HUD-92900-LT, FHA Loan Underwriting and Transmittal Summary.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "The abated real estate tax amount was used without meeting documentation & continuance requirements" -> EXCEPTION [O-FHA-56984] Significance: Critical | AOR: Underwriter
              Exception Detail: The abated real estate tax amount was used without meeting documentation and continuance requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "All of the data elements entered in the AUS were not correct" -> EXCEPTION [O-FHA-00554] Significance: Critical | AOR: Underwriter
              Exception Detail: All of the data elements entered in the AUS were not correct.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "The monthly PITIA did not include all of the applicable housing components" -> EXCEPTION [O-FHA-58946] Significance: Critical | AOR: Underwriter
              Exception Detail: The monthly PITIA did not include all of the applicable housing components.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "The Section 8 Housing Choice Voucher amount was deducted and is not paid directly to the servicer" -> EXCEPTION [O-FHA-56983] Significance: Critical | AOR: Underwriter
              Exception Detail: The amount of the Section 8 Housing Choice Voucher was deducted that is not paid directly to the servicer.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA') AND (Loans.Underwriting_Type = 'Automated Underwriting' OR Loans.Underwriting_Type = 'Desktop Underwriter' OR Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Yes, all   underwriting requirements were met" -> PASS
