block_id: application-verification
name: "Application Verification"
description: "Verifies URLA/1003 completeness, borrower identity, language preference, data consistency across the application, and borrower demographic data accuracy."
category: application-verification
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Application Verification. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (19 questions):
        Q1:
          CODE: Final URLA
          TEXT: Have all sections of the Final 1003 been completed and accurate?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The employment dates listed on the 1003 do not match other employment documentation in the file" -> EXCEPTION [URLA-Final-9] Significance: Major | AOR: Underwriter
            - "The final 1003 application is inaccurate or incomplete" -> EXCEPTION [URLA-Final-2] Significance: Major | AOR: Underwriter
            - "The final 1003 is missing either a 2 year residency or employment history" -> EXCEPTION [URLA-Final-4] Significance: Major | AOR: Underwriter
            - "The loan purpose selected on the final 1003 does not match the final 1008 and/or final DU" -> EXCEPTION [URLA-Final-5] Significance: Major | AOR: Underwriter
            - "The manner in which title is held on the 1003 does not match the title commitment" -> EXCEPTION [URLA-Final-8] Significance: Major | AOR: Underwriter
            - "The marital status is incomplete or appears inaccurate based on documentation in the file" -> EXCEPTION [URLA-Final-7] Significance: Major | AOR: Underwriter
            - "The refinance type selected on the final 1003 does not match the final 1008 and/or the final DU" -> EXCEPTION [URLA-Final-6] Significance: Major | AOR: Underwriter
            - "The title vesting on the final 1003 does not match the title commitment" -> EXCEPTION [URLA-Final-3] Significance: Major | AOR: Underwriter
            - "Discrepancies in the file not explained or supporting docs provided" -> EXCEPTION [Info Discrepancies] Significance: Major | AOR: Underwriter
              Exception Detail: Documentation not requested/provided to address loan file discrepancies.
            - "Yes, all sections of the final 1003 are complete and accurate" -> PASS
        Q2:
          CODE: O-VA-15711
          TEXT: Were all application disclosure requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No, the ARM pre-loan disclosure is missing or was not provided timely" -> EXCEPTION [O-VA-00072] Significance: Critical | AOR: Underwriter
              Exception Detail: The ARM loan file did not contain a signed Pre-Loan Disclosure.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "The LE was not provided within 3 days" -> EXCEPTION [LE3Days] Significance: Critical | AOR: Underwriter
              Exception Detail: LE was not provided within 3 days of application
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "No, the executed VA Counseling Checklist is missing or was not provided timely" -> EXCEPTION [O-VA-00071] Significance: Critical | AOR: Underwriter
              Exception Detail: The Service member is still in service and was not counseled with VA Form 26-0592, Counseling Checklist for Military Homebuyers, as early as possible in the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "The Service member is still in service & was not counseled with VA Form 26-0592 as early as possible" -> EXCEPTION [O-VA-00071] Significance: Critical | AOR: Underwriter
              Exception Detail: The Service member is still in service and was not counseled with VA Form 26-0592, Counseling Checklist for Military Homebuyers, as early as possible in the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "All disclosures (as required) have not been completed accurately & signed per guidelines" -> EXCEPTION [VAFee] Significance: Critical | AOR: Underwriter
              Exception Detail: All disclosures & worksheets have not been completed accurately or are not signed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "All worksheets (as required) have not been completed accurately & signed per guidelines" -> EXCEPTION [VAFee] Significance: Critical | AOR: Underwriter
              Exception Detail: All disclosures & worksheets have not been completed accurately or are not signed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all application disclosure requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q3:
          CODE: O-BP-14663
          TEXT: Were the following non-regulatory customary disclosures provided to the applicant in the initial disclosure package?_x000D_
          SIGNIFICANCE: Major
          AOR_PRIMARY: Processor
          RESPONSES:
            - "Borrower Certification and Authorization to Release Information was not provided" -> EXCEPTION [O-BP-54652] Significance: Major | AOR: Processor
              Exception Detail: The following non-regulatory customary disclosure was not provided to the applicant: Borrower Certification and Authorization to Release Information.
            - "Flood Insurance Coverage Disclosure was not provided" -> EXCEPTION [O-BP-54653] Significance: Major | AOR: Processor
              Exception Detail: The following non-regulatory customary disclosure was not provided to the applicant: Flood Insurance Subject to Change.
            - "Intent to Proceed with Application was not provided" -> EXCEPTION [O-BP-54654] Significance: Major | AOR: Processor
              Exception Detail: The following non-regulatory customary disclosure was not provided to the applicant:  Acknowledgement of Intent to Proceed (LE)/ Intent to Proceed with Application.
            - "Not Applicable" -> NOT_APPLICABLE
            - "Yes, all non-regulatory customary disclosures were provided to the applicant" -> PASS
        Q4:
          CODE: CIP DATA POINTS
          TEXT: Are the 4 Customer Identification Program (CIP) data points provided in file:  Name, Physical property address, DOB, SS#/Tax ID?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No, one or more of the CIP data points was not provided" -> EXCEPTION [CIP data points] Significance: Major | AOR: Underwriter
              Exception Detail: The 4 Customer Identification Program ( CIP ) data points have not been provided or are inconsistent.
            - "Yes, all CIP data points have been provided" -> PASS
        Q5:
          CODE: O-FHA-15293
          TEXT: Were all final Uniform Residential Loan Application requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "The final application is not in the file" -> EXCEPTION [O-FHA-50006] Significance: Critical | AOR: Closer
              Exception Detail: The final application is not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The final HUD-92900-A is missing, incomplete, incorrect &/or is not signed" -> EXCEPTION [O-FHA-54280] Significance: Critical | AOR: Closer
              Exception Detail: The final HUD/VA Addendum, HUD Addendum to Uniform Residential Loan Application, was incomplete, incorrect, and/or not signed by all required parties.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "All sections of URLA Additional Borrower form not fully completed, correct &/or signed as applicable" -> EXCEPTION [O-FHA-58072] Significance: Critical | AOR: Closer
              Exception Detail: All sections of the URLA Additional Borrower form were not fully completed, correct, or signed as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "It appears the borr needed more space to complete the URLA & a continuation sheet not in the file" -> EXCEPTION [O-FHA-58075] Significance: Critical | AOR: Closer
              Exception Detail: It appears the borrower needed more space to complete the URLA and a continuation sheet is not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Sections of the final URLA were incomplete, inaccurate &/or not signed by all parties" -> EXCEPTION [O-FHA-54281] Significance: Critical | AOR: Closer
              Exception Detail: All sections of the final Uniform Residential Loan Application, URLA were not completed, was incorrect and/or was not signed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Unmarried Addendum not completed as applicable when borrower selects "unmarried" in section 1" -> EXCEPTION [O-FHA-58071] Significance: Critical | AOR: Closer
              Exception Detail: The optional URLA Unmarried Addendum was added due to the borrower selecting unmarried in section 1 and the collected information is necessary by State property laws, however, the form was not completed correctly.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all final Uniform Residential Loan Application requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
