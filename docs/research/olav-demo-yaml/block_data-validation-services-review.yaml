block_id: data-validation-services
name: "Data Validation Services Review"
description: "Reviews data validation service results including AUS data integrity, appraisal data validation, income validation, and asset validation findings."
category: data-validation-services
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Data Validation Services Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (20 questions):
        Q1:
          CODE: O-FRD-16646
          TEXT: Were all additional appraised value requirements met to maintain Reps & Warrants Relief?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The ACE appraisal waiver offer was accepted where a PDR was obtained" -> EXCEPTION [O-FRD-58796] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE appraisal waiver offer was accepted where a PDR was obtained.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "A hybrid appraisal was used & last feedback cert did not indicate eligibility for a hybrid appraisal" -> EXCEPTION [O-FRD-58851] Significance: Critical | AOR: Underwriter
              Exception Detail: A hybrid appraisal was used where the last feedback certificate did not indicate the mortgage was eligible for a hybrid appraisal report.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all additional appraised value requirements were met to maintain Reps & Warrants Relief" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q2:
          CODE: O-FRD-14393
          TEXT: Were all appraised value requirements met to maintain Reps & Warrants Relief?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "ACE appraisal waiver offer not accepted as allowed when adverse property conditions were minor" -> EXCEPTION [O-FRD-58795] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE appraisal waiver offer was not accepted as allowed when adverse physical property conditions were minor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "ACE appraisal waiver used in a CO refi with an LTV over 70% or over 60% for a CO refi of a 2nd home" -> EXCEPTION [O-FRD-57517] Significance: Critical | AOR: Underwriter
              Exception Detail: ACE appraisal waiver was accepted in a cash-out refinance with an LTV over 70% or over 60% for a cash-out refinance of a 2nd home.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "QC review noted inaccurate data submitted to LPA invalidating the ACE appraisal waiver" -> EXCEPTION [O-FRD-54133] Significance: Critical | AOR: Underwriter
              Exception Detail: The QC review noted inaccurate data submitted to Loan Product Advisor invalidating the eligibility of the ACE appraisal waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "QC review determined ACE eligibility requirements not met as required for an ACE appraisal waiver" -> EXCEPTION [O-FRD-54134] Significance: Critical | AOR: Underwriter
              Exception Detail: The QC review determined that ACE eligibility requirements were not met as required for an ACE appraisal waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The last feedback cert did not reflect eligible for reps & warranty relief with an appraisal waiver" -> EXCEPTION [O-FRD-50852] Significance: Critical | AOR: Underwriter
              Exception Detail: The last feedback certificate does not indicate that the mortgage is eligible for representation and warranty relief with an appraisal waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Awareness of conditions that warrant an appraisal noted and appraisal waiver offer not rejected" -> EXCEPTION [O-FRD-51835] Significance: Critical | AOR: Underwriter
              Exception Detail: Review of the file indicates awareness of conditions that warrant obtaining an appraisal, however, the appraisal waiver offer was not rejected.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Where UAD ratings are not required, subject is not in a condition consistent with ratings C1 - C4" -> EXCEPTION [O-FRD-50854] Significance: Critical | AOR: Underwriter
              Exception Detail: Where UAD ratings are not required, the subject property is not in a condition consistent with condition ratings C1 through C4.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The property type, occupancy, LTV &/or transaction type is ineligible for an appraisal waiver" -> EXCEPTION [O-FRD-50958] Significance: Critical | AOR: Underwriter
              Exception Detail: The property type, occupancy, LTV and/or transaction type was ineligible to receive an appraisal waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The property is not acceptable to typical purchasers in the market where the property is located" -> EXCEPTION [O-FRD-50855] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject property is not acceptable to typical purchasers in the market in which the property is located.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Loan did not receive an LPA Risk Classification of Accept to qualify for an ACE appraisal waiver" -> EXCEPTION [O-FRD-50957] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan did not receive an LPA Risk Classification of Accept to qualify for an ACE appraisal waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The appraisal did not accurately reflect the market value of the subject property" -> EXCEPTION [O-FRD-50853] Significance: Critical | AOR: Underwriter
              Exception Detail: The appraisal did not accurately reflect the market value of the subject property.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all appraised value requirements were met to maintain Reps & Warrants Relief" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q3:
          CODE: O-FRD-16089
          TEXT: Were all automated collateral evaluation (ACE) + PDR (property data report) requirements met?_x000D_
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Settlement date over 120 days of Note date without seller warranty value is not less LPA value" -> EXCEPTION [O-FRD-55751] Significance: Critical | AOR: Underwriter
              Exception Detail: The settlement date is more than 120 days after the Note date and the file did not warrant the value of the subject is not less than the estimated value in Loan Product Advisor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "ACE+ PDR offer is older than 120 days without resubmission and retained eligibility" -> EXCEPTION [O-FRD-55746] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE+ PDR offer provided through the feedback certificate is older than 120 days without resubmission and retained eligibility.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "An ACE+ PDR was exercised in a loan that is not a cash-out or eligible no cash-out refinance" -> EXCEPTION [O-FRD-55748] Significance: Critical | AOR: Underwriter
              Exception Detail: An ACE+ PDR was exercised in a loan that is not a cash-out or eligible no cash-out refinance.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The ACE+ PDR offer was accepted where an appraisal is required by law or regulation" -> EXCEPTION [O-FRD-55744] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE+ PDR offer was accepted where an appraisal is required by law or regulation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The ACE+ PDR offer was accepted where the loan requires an upgrade to an appraisal" -> EXCEPTION [O-FRD-55745] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE+ PDR offer was accepted where the loan requires an upgrade to an appraisal.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "An ACE+ PDR was exercised in a mortgage with an ineligible mortgage product and/or property type" -> EXCEPTION [O-FRD-55750] Significance: Critical | AOR: Underwriter
              Exception Detail: An ACE+ PDR was exercised in a mortgage with an ineligible mortgage product and/or property type.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Maximum LTV/TLTV ratio requirements were exceeded in a loan using an ACE+ PDR" -> EXCEPTION [O-FRD-55749] Significance: Critical | AOR: Underwriter
              Exception Detail: Maximum LTV/TLTV ratio requirements were exceeded in a loan using an ACE+ PDR.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "ACE+ PDR offer accepted where FHLMC has performed a property review or obtained a property valuation" -> EXCEPTION [O-FRD-55743] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE+ PDR offer was accepted where Freddie Mac has performed a property review or obtained a valuation of the subject property.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The ACE+ PDR loan was not delivered using the applicable ULDD data points" -> EXCEPTION [O-FRD-55747] Significance: Critical | AOR: Underwriter
              Exception Detail: The ACE+ PDR loan was not delivered using the applicable ULDD data points.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Appraisal waiver used in a purchase without evidence the seller accepted the appraisal waiver option" -> EXCEPTION [O-FRD-56982] Significance: Critical | AOR: Underwriter
              Exception Detail: An appraisal waiver was used in a purchase transaction without evidence the seller accepted the appraisal waiver option.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all automated collateral evaluation (ACE) + PDR (property data report) requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q4:
          CODE: O-FRD-15948
          TEXT: Were all automated income assessment with Loan Product Advisor using account data (AIM) requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "AIM alimony, child support or separate maintenance payment income not documented as req'd" -> EXCEPTION [O-FRD-55611] Significance: Critical | AOR: Underwriter
              Exception Detail: AIM account data alimony, child support or separate maintenance payment income was not documented with the legally binding documentation verifying the payor’s obligation for the previous 6 months, including the amount and the duration of the obligation, and ages of the children for which child support is received.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Verification report assets are not in U.S. dollars in a U.S./State-regulated financial institution" -> EXCEPTION [O-FRD-59080] Significance: Critical | AOR: Underwriter
              Exception Detail: One or more assets shown on the verification report are not in U.S. dollars located in a U.S. or State-regulated financial institution.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "AIM contradictory information was not addressed/updated in LPA" -> EXCEPTION [O-FRD-55615] Significance: Critical | AOR: Underwriter
              Exception Detail: Automated income assessment with Loan Product Advisor using account data in AIM was used without addressing and/or updating any contradictory information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Verification report did not confirm depository account owned by at least 1 borr with account access" -> EXCEPTION [O-FRD-55612] Significance: Critical | AOR: Underwriter
              Exception Detail: Each verification report obtained did not confirm each depository account is owned by at least one borrower with account access as required in the automated income assessment with Loan Product Advisor using account data in AIM.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "File info contradicts the expectation that income will continue for 3 years, which was not addressed" -> EXCEPTION [O-FRD-59081] Significance: Critical | AOR: Underwriter
              Exception Detail: There is information or documentation in the file that contradicts the expectation that the income will continue for at least the next 3 years, which was not addressed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "AIM payor of the income was not confirmed using the information in the file" -> EXCEPTION [O-FRD-55613] Significance: Critical | AOR: Underwriter
              Exception Detail: The payor of the income was not confirmed using the information in the file as required in the automated income assessment with Loan Product Advisor using account data in AIM.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Income submitted not the amt used to UW the automated income assessment with LPA using account data" -> EXCEPTION [O-FRD-55614] Significance: Critical | AOR: Underwriter
              Exception Detail: The income amount submitted was not the amount used to underwrite to the automated income assessment with Loan Product Advisor using account data in AIM.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Verification report expired or was not the final report reflected on the Last Feedback Certificate" -> EXCEPTION [O-FRD-55606] Significance: Critical | AOR: Underwriter
              Exception Detail: The verification report was expired or was not the final report reflected on the Last Feedback Certificate.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Ineligible income type used in automated income assessment with LPA using account data in AIM" -> EXCEPTION [O-FRD-55607] Significance: Critical | AOR: Underwriter
              Exception Detail: The income type used was ineligible for the automated income assessment with Loan Product Advisor using account data in AIM.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Yes, all automated income assessment with LPA using account data (AIM) requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.Underwriting_Type = 'Loan Product Advisor')
        Q5:
          CODE: O-FRD-16118
          TEXT: Were all pre-closing verification automated employment assessment with Loan Product Advisor using account data (AIM) requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Contradictory info between verification report/URLA/file not resolved & if applicable, resubmitted" -> EXCEPTION [O-FRD-55780] Significance: Critical | AOR: Underwriter
              Exception Detail: Contradictory information between the verification report, information contained in the URLA (including income and employment representations), and the mortgage file, was not investigated and resolved and if applicable, resubmitted with the correct information to Loan Product Advisor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "No evidence each AIM eligible account on the verification report is owned by at least one borrower" -> EXCEPTION [O-FRD-55778] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not evidence that each AIM eligible account on the verification report is owned by at least one borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "AIM employment acct data did not reflect a min of 3 consecutive payroll deposits from same payor(s)" -> EXCEPTION [O-FRD-55779] Significance: Critical | AOR: Underwriter
              Exception Detail: AIM employment earnings using account data depository history did not reflect a minimum of three consecutive payroll deposits from the same payor(s).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Paystubs provided to the third-party service for AIM using direct deposits was not in the file" -> EXCEPTION [O-FRD-56571] Significance: Critical | AOR: Underwriter
              Exception Detail: Paystubs provided to the third-party service provider for AIM using direct deposits were not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Paystubs provided to the third-party service for AIM using direct deposits did not meet age req's" -> EXCEPTION [O-FRD-56570] Significance: Critical | AOR: Underwriter
              Exception Detail: Paystubs provided to the third-party service provider for AIM using direct deposits did not meet the age of documentation requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "AIM employment 10-day PCV “close-by-date” was not met" -> EXCEPTION [O-FRD-55781] Significance: Critical | AOR: Underwriter
              Exception Detail: The automated employment assessment related to the 10-day pre-closing verification (PCV) “close-by-date” was not met.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "10 day PCV 3rd party svc provider did not reflect at least 3 consecutive payroll deposits same payor" -> EXCEPTION [O-FRD-55777] Significance: Critical | AOR: Underwriter
              Exception Detail: The 10 day pre-closing verification (PCV) third-party service provider did not transmit a minimum of three consecutive payroll deposits from the same payor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Current PCV employment assessment report not produced by 3rd party svc provider with QC procedures" -> EXCEPTION [O-FRD-55776] Significance: Critical | AOR: Underwriter
              Exception Detail: The most current PCV automated employment assessment verification report was not produced by a third-party service provider with procedures to comply with quality control requests for reverification from Freddie Mac, the Seller and/or Servicer.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Earnings ineligible for auto employment assessment due to business ownership interest less than 25%" -> EXCEPTION [O-FRD-59275] Significance: Critical | AOR: Underwriter
              Exception Detail: The employment earnings are ineligible for automated employment assessment with Loan Product Advisor due to the borrower having business ownership interest(s) less than 25%.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
            - "Yes, all PCV automated employment assessment with LPA using account data (AIM) requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac' AND Loans.Underwriting_Type = 'Loan Product Advisor')
        Q6:
          CODE: O-FNM-14388
          TEXT: Were all income DU Validation requirements met to maintain Reps & Warrants Relief?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Income/employ validated with an asset verif report w/out 12 mos data from eligible 3rd party vendor" -> EXCEPTION [O-FNM-57667] Significance: Critical | AOR: Underwriter
              Exception Detail: An asset verification report was used to validate income/employment that did not contain at least 12 months of data from the borrower’s checking and/or savings account(s) from an approved third-party vendor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Difference between DU calculated income & income provided by the lender exceed allowable tolerance" -> EXCEPTION [O-FNM-50836] Significance: Critical | AOR: Underwriter
              Exception Detail: The difference between the income amounts calculated by DU and the amounts provided by the lender exceeded the allowable tolerance.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "File missing the Employment and Income Verification Report for validated commission income" -> EXCEPTION [O-FNM-50830] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain the Employment and Income Verification Report for validated commission income.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Missing Employment & Income Verification Report for validated base, bonus, OT or commission < 25%" -> EXCEPTION [O-FNM-50829] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain the Employment and Income Verification Report where validated income is base, bonus, overtime or commission less than 25%.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "File missing a tax transcript where validated income is from retirement (annuities and pension)" -> EXCEPTION [O-FNM-50831] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a tax return transcript where the validated income is from retirement (annuities and pension).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "File missing tax transcript for validated self-employed income (1040, C or C-EZ sole propriet only)" -> EXCEPTION [O-FNM-50833] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a tax return transcript where the validated income is from self-employed income (IRS Form 1040 Schedules C or C-EZ for sole proprietorships only).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Validated SS (retire, disability, supp, survivor) missing tax transcript/addt'l docs per SSI type" -> EXCEPTION [O-FNM-50832] Significance: Critical | AOR: Underwriter
              Exception Detail: Where the validated income is from Social Security (retirement, disability, supplemental, survivor benefits), the file did not contain a tax return transcript and any additional documentation required based on the type of Social Security income as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "VOI was validated but VOE was not, the associated income not documented as per req's" -> EXCEPTION [O-FNM-50835] Significance: Critical | AOR: Underwriter
              Exception Detail: Where the income (VOI) was validated but the employment (VOE) was not, the lender did not document the associated income in accordance with the selling guide.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "All income shown on the Income Verification Report was not reflected in U.S. dollars" -> EXCEPTION [O-FNM-55909] Significance: Critical | AOR: Underwriter
              Exception Detail: All income shown on the Income Verification Report was not reflected in U.S. dollars.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The full asset verification report used to validate income/employment is not in the file" -> EXCEPTION [O-FNM-57668] Significance: Critical | AOR: Underwriter
              Exception Detail: The full asset verification report used to validate income/employment, containing the entirety of the data provided to DU, is not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all DU income requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q7:
          CODE: O-FNM-14390
          TEXT: Were all asset DU requirements met to maintain Reps & Warrants Relief?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Actual funds to close exceeds funds in DU & assets to cover not in file &/or not resub if applicable" -> EXCEPTION [O-FNM-50843] Significance: Critical | AOR: Underwriter
              Exception Detail: The actual amount of funds required to complete the transaction is higher than the funds required to close as specified in DU without the liquid assets being documented to cover the additional amount and/or was not resubmitted to DU if applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Business act on verification report, no cash flow analysis to confirm use will not have neg impact" -> EXCEPTION [O-FNM-50844] Significance: Critical | AOR: Underwriter
              Exception Detail: The lender did not perform a business cash flow analysis to confirm that the withdrawal of funds for this transaction will not have a negative impact on the business where the borrower is self-employed and an eligible asset account is reflected as a business account on the verification report.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Business asset not removed/Verif Report not updated/resub & cash analysis shows neg impact business" -> EXCEPTION [O-FNM-50845] Significance: Critical | AOR: Underwriter
