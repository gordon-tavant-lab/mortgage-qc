block_id: closing-documents-review
name: "Closing Documents Review"
description: "Reviews closing documents including the note, deed of trust, closing disclosure, escrow instructions, e-signatures, and recording status."
category: closing-documents-review
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Closing Documents Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (34 questions):
        Q1:
          CODE: O-FNM-15455
          TEXT: Is the electronic closing documentation complete and accurate in accordance with agency/GSE requirements?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "The file did not document who has the right to enforce the Authoritative Copy of the eNote" -> EXCEPTION [O-FNM-58308] Significance: Critical | AOR: Closer
              Exception Detail: The file did not document who has the right to enforce the Authoritative Copy of the eNote.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eNote did not contain a valid unique 18-digit Mortgage Identification Number (MIN)" -> EXCEPTION [O-FNM-58312] Significance: Critical | AOR: Closer
              Exception Detail: The eNote did not contain a valid unique 18-digit Mortgage Identification Number (MIN).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The subject loan had an eMortgage component without tamper-evident security" -> EXCEPTION [O-FNM-58306] Significance: Critical | AOR: Closer
              Exception Detail: The subject loan had an eMortgage component without tamper-evident security.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The subject eNote did not contain an eNote clause" -> EXCEPTION [O-FNM-58310] Significance: Critical | AOR: Closer
              Exception Detail: The subject eNote did not contain an eNote clause.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eNote Vault System used did not meet the legal, technological, and operational requirements" -> EXCEPTION [O-FNM-58314] Significance: Critical | AOR: Closer
              Exception Detail: The eNote Vault System used to originate the eMortgage did not meet the legal, technological, and operational requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eNote was not registered with the MERS® eRegistry immediately upon execution by the borrower" -> EXCEPTION [O-FNM-58316] Significance: Critical | AOR: Closer
              Exception Detail: The eNote was not registered with the MERS® eRegistry immediately upon execution by the borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all electronic closing documentation is complete and accurate" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The file did not document who has  the right to enforce the Authoritative Copy of the eNote" -> EXCEPTION [O-BP-54092] Significance: Critical | AOR: Closer
              Exception Detail: The file did not document who has the right to enforce the Authoritative Copy of the eNote.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The CIP Identification form was not found or is incomplete/inaccurate" -> EXCEPTION [O-FinCEN-00757] Significance: Critical | AOR: Closer
              Exception Detail: The borrower’s identity was not verified at closing using an unexpired, government-issued identification that evidences the borrower’s nationality or residence and bears a photograph or similar safeguard such as a driver’s license or a passport.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Encryption algorithms used by eClosing system not compliant with NIST & FIPS 140-2 guidance" -> EXCEPTION [O-BP-54099] Significance: Critical | AOR: Closer
              Exception Detail: The encryption algorithms used by the eClosing system and processes are not compliant with the National Institute of Standards and Technology (NIST) and FIPS 140-2 guidance.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eNote did not have a MIN that matches the MIN on the Security Instrument" -> EXCEPTION [O-BP-54094] Significance: Critical | AOR: Closer
              Exception Detail: The eNote did not have a MIN that matches the MIN on the Security Instrument.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "eVault does not have the functionality to view/print a copy of an eNote & see its associated data" -> EXCEPTION [O-BP-54098] Significance: Critical | AOR: Closer
              Exception Detail: No evidence the eVault has the functionality to view and print a copy of an eNote and see its associated data.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eVault is unable to segregate transferable records from other electronic records as applicable" -> EXCEPTION [O-BP-54097] Significance: Critical | AOR: Closer
              Exception Detail: The eVault does not have the ability to partition or segregate transferable records from other electronic records as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "No evidence the eVault complies with investor req's to store the authoritative copy of the eNote" -> EXCEPTION [O-BP-54095] Significance: Critical | AOR: Closer
              Exception Detail: No evidence that a secure eVault that complies with investor requirements is available to store the authoritative copy of the eNote.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "RIN used w/out all temporary authorization, state Notary laws & any supplemental guidance being met" -> EXCEPTION [O-BP-54100] Significance: Critical | AOR: Closer
              Exception Detail: Remote ink-signed notarization (RIN) was utilized without all requirements in the temporary authorization, state Notary laws, and any supplemental guidance being met.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all closing documentation is complete and accurate" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q2:
          CODE: O-FRD-15613
          TEXT: Where the loan was closed as an electronic transaction, were all general requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "The file did not document who has the right to enforce the Authoritative Copy of the eNote" -> EXCEPTION [O-FRD-58309] Significance: Critical | AOR: Closer
              Exception Detail: The file did not document who has the right to enforce the Authoritative Copy of the eNote.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Encryption algorithms used by eClosing system not compliant with NIST & FIPS 140-2 guidance" -> EXCEPTION [O-FRD-58318] Significance: Critical | AOR: Closer
              Exception Detail: The encryption algorithms used by the eClosing system and processes are not compliant with the National Institute of Standards and Technology (NIST) and FIPS 140-2 guidance.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "E-sign docs disclosure, consent, signature, presentation, delivery, retention & state req's not met" -> EXCEPTION [O-FRD-51633] Significance: Critical | AOR: Closer
              Exception Detail: Documents were electronically signed without meeting all requirements of the E-SIGN Act, including those relating to disclosures, consent, signature, presentation, delivery, retention and any state law met as applicable to the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The MIN in Loan Selling Advisor is not the same as the MIN on the eNote" -> EXCEPTION [O-FRD-58313] Significance: Critical | AOR: Closer
              Exception Detail: The MIN in Loan Selling Advisor is not the same as the MIN on the eNote.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The subject loan had an eMortgage component without tamper-evident security" -> EXCEPTION [O-FRD-58307] Significance: Critical | AOR: Closer
              Exception Detail: The subject loan had an eMortgage component without tamper-evident security.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The subject eNote did not contain an eNote clause" -> EXCEPTION [O-FRD-58311] Significance: Critical | AOR: Closer
              Exception Detail: The subject eNote did not contain an eNote clause.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The eNote Vault System used did not meet the legal, technological, and operational requirements" -> EXCEPTION [O-FRD-58315] Significance: Critical | AOR: Closer
              Exception Detail: The eNote Vault System used to originate the eMortgage did not meet the legal, technological, and operational requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "eNote not MERS registered as soon as possible or over 1 business day after closing/eMtg FHLMC cert" -> EXCEPTION [O-FRD-58317] Significance: Critical | AOR: Closer
              Exception Detail: The eNote was not registered with the MERS® eRegistry, using a MIN, as soon as possible, but no later than 1 business day after the eMortgage loan closing date and before certification of the eMortgage by Freddie Mac.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all general electronic requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q3:
          CODE: O-RHS-15696
          TEXT: Were all repair escrow requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "Borr self-comp escrow repairs: cost over 10% of loan, escrow $10,000 or less, ability, not in file" -> EXCEPTION [O-RHS-59182] Significance: Critical | AOR: Closer
              Exception Detail: Borrower completed escrow repairs without the assistance of a contractor where the estimated cost to complete exceeded 10% of the total loan amount, escrow amount is less than or equal to $10,000, and/or evidence the borrower had the knowledge, skills, and time to complete within 180 days was not documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Closing Statement does not reflect the escrow holdback and/or was incorrect" -> EXCEPTION [O-RHS-50585] Significance: Critical | AOR: Closer
              Exception Detail: The Closing Statement did not reflect the escrow holdback and/or it was incorrect.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Repairs postponed due to weather/materials/other acceptable reasons & repair escrow not established" -> EXCEPTION [O-RHS-02692] Significance: Critical | AOR: Closer
              Exception Detail: Planned repairs were postponed due to inclement weather, material shortages, or other acceptable reasons, and an acceptable repair escrow was not established at closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Combination of both the exterior and interior repair escrows exceed 10% of the final loan amt" -> EXCEPTION [O-RHS-50583] Significance: Critical | AOR: Closer
              Exception Detail: The combination of both exterior and interior repair escrows exceeded 10 percent of the final loan amount.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Cert of Completion by appraiser w/ photos for escrow repairs not in file" -> EXCEPTION [O-RHS-50586] Significance: Critical | AOR: Closer
              Exception Detail: The file did not contain a Certification of Completion with photos confirming completion of escrow repair items in accordance with the requirements and conditions in the original appraisal.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Verification escrow repairs completed w/in 180 days of closing not in file" -> EXCEPTION [O-RHS-50584] Significance: Critical | AOR: Closer
              Exception Detail: The file did not contain documentation confirming the required escrow repair items were completed or were not completed within 180 days of closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Unallowable items were escrowed for post closing repairs" -> EXCEPTION [O-RHS-50582] Significance: Critical | AOR: Closer
              Exception Detail: Unallowable items such as roof repairs, foundation, basic structure, or electricity, plumbing, or heating fuel delivery were allowed to be escrowed for post-closing repair.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all repair escrow requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "No, an acceptable repair escrow account was not established where required" -> EXCEPTION [O-RHS-02692] Significance: Critical | AOR: Closer
              Exception Detail: Planned repairs were postponed due to inclement weather, material shortages, or other acceptable reasons, and an acceptable repair escrow was not established at closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q4:
          CODE: O-FHA-15295
          TEXT: Were all mortgage closing requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Processor
          RESPONSES:
            - "Property sold w/in 12 mos of case# asgmt no review for undisclosed Identity-of-Interest transactions" -> EXCEPTION [O-FHA-50702] Significance: Major | AOR: Processor
              Exception Detail: A chain of title was not obtained for the subject that sold within 12 months of the case number assignment date or the file did not document that prior ownership did not include any undisclosed Identity-of-Interest transactions.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The Mortgage, Note, riders &/or other closing documents were not signed by all required parties" -> EXCEPTION [O-FHA-50707] Significance: Major | AOR: Processor
              Exception Detail: The Mortgage, Note, riders and/or other closing documents were not signed by all required parties.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Escrow/closing or settlement instructions not in the file as applicable" -> EXCEPTION [O-FHA-50909] Significance: Major | AOR: Processor
              Exception Detail: The file did not contain escrow/closing or settlement instructions as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The escrow accrual amount is insufficient to cover all escrow obligations" -> EXCEPTION [O-FHA-00781] Significance: Major | AOR: Processor
              Exception Detail: The monthly amount of escrow is insufficient to cover all escrow obligations.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "POA not in the file where documents were signed by an Atorney in fact" -> EXCEPTION [O-FHA-51057] Significance: Major | AOR: Processor
              Exception Detail: A Power of Attorney (POA) was not provided and there were documents signed by an Attorney in fact.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "POA is an ineligible person and/or a copy of the POA Agreement not in the file" -> EXCEPTION [O-FHA-50000] Significance: Major | AOR: Processor
              Exception Detail: A POA was utilized to sign the closing documents however, the attorney-in-fact is an ineligible person.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "A rate lock fee was charged and there is no evidence of a rate lock agreement in the file" -> EXCEPTION [O-FHA-00769] Significance: Major | AOR: Processor
              Exception Detail: The borrower paid a lock-in and rate lock fee without a commitment agreement being in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "A signed HUD-92300/Mortgagee’s Assurance of Completion, not in file for escrowed repairs" -> EXCEPTION [O-FHA-50705] Significance: Major | AOR: Processor
              Exception Detail: A repair escrow was required, however, the lender did not execute form HUD-92300, Mortgagee’s Assurance of Completion, to indicate that the repair escrow has been established.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The Settlement Certification was not signed by all required parties" -> EXCEPTION [O-FHA-00765] Significance: Major | AOR: Processor
              Exception Detail: The Settlement Certification was not signed by all required parties.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Exceptions were discovered during the title search not covered by the General Waiver" -> EXCEPTION [O-FHA-50704] Significance: Major | AOR: Processor
              Exception Detail: Exceptions were discovered during the title search that were not covered by the General Waiver.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all mortgage closing requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q5:
          CODE: FRD-Closing
          TEXT: Is the closing documentation complete and accurate in accordance with agency requirements?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Settlement Agent
          RESPONSES:
            - "The CIP Identification form was not found or is incomplete/inaccurate" -> EXCEPTION [O-FinCEN-00757] Significance: Major | AOR: Settlement Agent
              Exception Detail: The borrower’s identity was not verified at closing using an unexpired, government-issued identification that evidences the borrower’s nationality or residence and bears a photograph or similar safeguard such as a driver’s license or a passport.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac'
            - "Yes, the closing documentation is complete and accurate" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac'
        Q6:
          CODE: O-FHA-15296
          TEXT: Were all additional mortgage closing requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Settlement Agent
          RESPONSES:
            - "The CIP Identification form was not found or is incomplete/inaccurate" -> EXCEPTION [O-FinCEN-00757] Significance: Major | AOR: Settlement Agent
              Exception Detail: The borrower’s identity was not verified at closing using an unexpired, government-issued identification that evidences the borrower’s nationality or residence and bears a photograph or similar safeguard such as a driver’s license or a passport.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "All applicable escrow funds not collected at closing and/or the amounts collected were incorrect" -> EXCEPTION [O-FHA-00782] Significance: Major | AOR: Settlement Agent
              Exception Detail: All applicable escrow funds were not collected at closing and/or the amounts collected were incorrect.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The late charge exceeds the 4% maximum for government loans" -> EXCEPTION [O-FHA-50008] Significance: Major | AOR: Settlement Agent
              Exception Detail: The late charge reflected on the Note is greater than 4%.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Applicable Notice to Homeowner: Release of Personal Liability not sent prior to settlement" -> EXCEPTION [O-FHA-51134] Significance: Major | AOR: Settlement Agent
              Exception Detail: The applicable Notice to Homeowner: Release of Personal Liability was not sent to all applicants prior to settlement.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all additional mortgage closing requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q7:
          CODE: O-RHS-15697
          TEXT: Were all loan closing requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Settlement Agent
          RESPONSES:
            - "The CIP Identification form was not found or is incomplete/inaccurate" -> EXCEPTION [O-FinCEN-00757] Significance: Major | AOR: Settlement Agent
              Exception Detail: The borrower’s identity was not verified at closing using an unexpired, government-issued identification that evidences the borrower’s nationality or residence and bears a photograph or similar safeguard such as a driver’s license or a passport.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "No, loan closed after the expiration date on the conditional commitment without a valid extension" -> EXCEPTION [O-RHS-02871] Significance: Major | AOR: Settlement Agent
              Exception Detail: The loan was not closed before the expiration date on the conditional commitment and a valid extension of the date was not granted.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Information and/or final loan terms on the closing documents incorrect" -> EXCEPTION [O-RHS-50525] Significance: Major | AOR: Settlement Agent
              Exception Detail: All of the information or final loan terms on the closing documents were not correct including the settlement statement, Note, Mortgage, Title and/or any additional required closing documentation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The Mortgage, Note, riders &/or other closing documents were not signed by all required parties" -> EXCEPTION [O-RHS-02873] Significance: Major | AOR: Settlement Agent
              Exception Detail: The Mortgage, Note, riders or other closing document was not signed by all required parties.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "No, loan closed without prior RHS approval with changed terms/characteristics/unsatisfied conditions" -> EXCEPTION [O-RHS-02872] Significance: Major | AOR: Settlement Agent
              Exception Detail: There was a change in the loan terms, a characteristic of the borrower or the property, or a condition has not been met without receiving prior written approval from RHS.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Signed optional Form RD 3555-18/18E, Lender Cert, not in file and the LLC was officially unavailable" -> EXCEPTION [O-RHS-02874] Significance: Major | AOR: Settlement Agent
              Exception Detail: A signed optional Form RD 3555-18/18E, Lender Certification, is not in the file as required when the Lender Loan Closing (LLC) is officially unavailable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Power of Attorney not in the file" -> EXCEPTION [O-RHS-50606] Significance: Major | AOR: Settlement Agent
              Exception Detail: Documents were signed by an Attorney in Fact without a copy of the Power of Attorney in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, applicant(s) signed a blank or incomplete document or sheet of paper" -> EXCEPTION [O-RHS-02716] Significance: Major | AOR: Settlement Agent
              Exception Detail: There evidence in the file that the borrowers signed blank or incomplete documents.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all loan closing requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q8:
          CODE: O-VA-15771
          TEXT: Were all loan closing requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Settlement Agent
          RESPONSES:
            - "The CIP Identification form was not found or is incomplete/inaccurate" -> EXCEPTION [O-FinCEN-00757] Significance: Major | AOR: Settlement Agent
              Exception Detail: The borrower’s identity was not verified at closing using an unexpired, government-issued identification that evidences the borrower’s nationality or residence and bears a photograph or similar safeguard such as a driver’s license or a passport.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "No, all funds were not disbursed properly" -> EXCEPTION [O-VA-00800] Significance: Major | AOR: Settlement Agent
              Exception Detail: All funds were not properly disbursed at closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "The lender chose to escrow taxes and/or insurance, & applicable laws/RESPA was not complied with" -> EXCEPTION [O-VA-00801] Significance: Major | AOR: Settlement Agent
              Exception Detail: Where the lender chose to escrow for taxes and insurance, applicable laws, including the Real Estate Settlement Procedures Act (RESPA) was not complied with.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "No, the required VA funding fee was not collected from the veteran" -> EXCEPTION [O-VA-00796] Significance: Major | AOR: Settlement Agent
              Exception Detail: The file did not document that the borrower paid the VA funding fee.
