            - "No, property is located in a SFHA and escrows were not established for collection of flood premiums" -> EXCEPTION [O-FDPA-51089] Significance: Critical | AOR: Underwriter
              Exception Detail: Escrow was not established for the collection of flood insurance premiums and fees on behalf of the borrower where the subject property is located in a special flood hazard area.
            - "The flood insurance deductible requirements as per property type were not met" -> EXCEPTION [O-FNM-56261] Significance: Critical | AOR: Underwriter
              Exception Detail: The flood insurance deductible requirements as per property type were not met.
            - "No, the escrow account does not include premiums and fees for payment of the flood insurance policy" -> EXCEPTION [O-FDPA-50001] Significance: Critical | AOR: Underwriter
              Exception Detail: Flood insurance is required and the escrow account established at consummation does not include all premiums and fees for payment of the flood insurance policy.
            - "No, the Notice of Special Flood Hazard Area was not mailed or delivered to the borrower(s)" -> EXCEPTION [O-FDPA-50002] Significance: Critical | AOR: Underwriter
              Exception Detail: The Notice of Special Flood Hazards and Availability of Federal Disaster Relief Assistance was not mailed to the applicants within a reasonable time before the completion of the transaction.
            - "No, the SFHDF fee charged to the borrower exceeds the actual costs + life of loan monitoring fee" -> EXCEPTION [O-FDPA-51091] Significance: Critical | AOR: Underwriter
              Exception Detail: The fee for the Standard Flood Hazard Determination Form (SFHDF) charged to the borrower was not limited to actual costs of the determination, plus life-of-loan monitoring, where applicable.
            - "No, a complete and accurate SFHDF was not used to evaluate the loan for flood insurance requirements" -> EXCEPTION [O-FDPA-51090] Significance: Critical | AOR: Underwriter
              Exception Detail: The file does not reflect a complete and accurate Standard Flood Hazard Determination Form (SFHDF) was used to evaluate the loan for flood insurance requirements.
            - "No, sufficient flood coverage was not in effect as of the date of loan consummation" -> EXCEPTION [O-FDPA-50000] Significance: Critical | AOR: Underwriter
              Exception Detail: The file does not contain evidence of sufficient flood coverage in effect as of the date of loan consummation.
            - "No, the Notice of Special Flood Hazard Area does not contain all required disclosure language" -> EXCEPTION [O-FDPA-50003] Significance: Critical | AOR: Underwriter
              Exception Detail: The Notice of Special Flood Hazard Area does not contain all required disclosure language in accordance with the model clauses in Appendix A (Rev. 01-01-2016).
            - "Private flood insurance policy does not meet the definition or include the prerequisite statement" -> EXCEPTION [O-FDPA-51120] Significance: Critical | AOR: Underwriter
              Exception Detail: Where the property is located in a SFHA and a private flood insurance policy is received that a) meets the definition of private flood insurance, or b) includes the following statement within the policy or as an endorsement to the policy: “This policy meets the definition of private flood insurance contained in 42 U.S.C. 4012a(b)(7) and the corresponding regulation.”, the private flood insurance policy was not accepted. [Mandatory on or after July 1, 2019]
            - "Private flood policy discretionary acceptance requirements were not met" -> EXCEPTION [O-FDPA-51800] Significance: Critical | AOR: Underwriter
              Exception Detail: Where the property is located in a SFHA and a private flood insurance policy issued by a private insurer is accepted in accordance with the discretionary acceptance requirements, the policy was not issued by an insurer permitted under the regulation and/or the policy does not provide a sufficient amount of insurance or cover both the mortgagor(s) and the mortgagee(s) as loss payees.
            - "Not Applicable" -> NOT_APPLICABLE
            - "Yes, SFHDF and, if required, federal flood insurance requirements were met" -> PASS
            - "Yes, all federal flood insurance requirements were met" -> PASS
