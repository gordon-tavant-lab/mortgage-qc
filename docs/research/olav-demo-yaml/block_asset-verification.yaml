block_id: asset-verification
name: "Asset Verification"
description: "Verifies borrower assets including bank statements, investment accounts, gift funds, earnest money deposits, and reserve requirements for loan qualification."
category: asset-verification
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Asset Verification. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (75 questions):
        Q1:
          CODE: O-FRD-15502
          TEXT: Were all other asset type requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Proceeds from a 1031 exchange was not documented and verified" -> EXCEPTION [O-FRD-56002] Significance: Critical | AOR: Underwriter
              Exception Detail: Proceeds from a 1031 exchange was not documented and verified.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Bridge loan proceeds - evidence loan is secured by real property & receipt of proceeds not in file" -> EXCEPTION [O-FRD-56003] Significance: Critical | AOR: Underwriter
              Exception Detail: Bridge loan proceeds were not documented with evidence the loan is secured by the borrower's real property and evidence of receipt of the disbursed loan proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Funds for closing from credit card, cash advance or unsecured LOC did not meet requirements" -> EXCEPTION [O-FRD-02619] Significance: Critical | AOR: Underwriter
              Exception Detail: Funds needed to complete the transaction were obtained from a credit card charge/cash advance or unsecured line of credit without all requirements being met and/or all applicable documentation not provided.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Corporate relocation program, the file does not contain a copy of the executed buyout agreement" -> EXCEPTION [O-FRD-00266] Significance: Critical | AOR: Underwriter
              Exception Detail: A source of the borrower’s funds is an employer relocation program, a copy of the executed buyout agreement was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "HELOC closing funds not secured by the borrower’s real property &/or HELOC proceeds  not received" -> EXCEPTION [O-FRD-55519] Significance: Critical | AOR: Underwriter
              Exception Detail: The HELOC funds for closing were not documented as being secured by the borrower’s real property and/or that the HELOC proceeds were disbursed to the borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Pooled funds-File did not document that the participants and the source of funds are eligible" -> EXCEPTION [O-FRD-02621] Significance: Critical | AOR: Underwriter
              Exception Detail: Pooled funds are considered without all eligibility and continuance requirements being met.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Rent credited to sale price no rent-sale agmt or credit exceeds difference rent paid & market rent" -> EXCEPTION [O-FRD-00275] Significance: Critical | AOR: Underwriter
              Exception Detail: Rent credits are included towards the down payment or closing costs, a copy of the rental/purchase agreement was not in the file and/or all requirements not met.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Non-property asset secured loan ineligible source/ownership, value, receipt of funds not documented" -> EXCEPTION [O-FRD-00264] Significance: Critical | AOR: Underwriter
              Exception Detail: Proceeds from a loan fully secured by the borrower's non-property assets were needed to qualify, the source was ineligible and/or the file did not document ownership, value and/or receipt of funds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Prorated real estate tax credit by the seller was included in determining enough funds for closing" -> EXCEPTION [O-FRD-54697] Significance: Critical | AOR: Underwriter
              Exception Detail: The prorated real estate tax credit contributed by the property seller was included in determining sufficient funds for closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "No appraisal & copy of trade-in contract to document equity net proceeds of trade in of prior home" -> EXCEPTION [O-FRD-00272] Significance: Critical | AOR: Underwriter
              Exception Detail: Net proceeds of the trade-in of the borrower's previously owned residence were part of the transaction; the file did not contain a copy of the traded property appraisal and/or a copy of the trade-in contract
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all other asset type requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q2:
          CODE: O-FRD-15499
          TEXT: Were all gift and/or grant fund requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Gift funds provided were not from an acceptable donor" -> EXCEPTION [O-FRD-55978] Significance: Critical | AOR: Underwriter
              Exception Detail: Gift funds provided were not from an acceptable donor.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The  gift or grant from an eligible agency was not documented as required" -> EXCEPTION [O-FRD-00233] Significance: Critical | AOR: Underwriter
              Exception Detail: A gift or grant from an eligible agency is needed to qualify, the file does not contain documentation supporting the gift or grant.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "No, gift letter with all the required information not provided" -> EXCEPTION [O-FRD-00231] Significance: Critical | AOR: Underwriter
              Exception Detail: A source of the borrower’s funds is a gift or gift of equity and all required information was not included on the gift letter.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Gift of equity not on the Settlement/Closing Disclosure Statement or amount incorrect" -> EXCEPTION [O-FRD-50463] Significance: Critical | AOR: Underwriter
              Exception Detail: The Settlement/Closing Disclosure Statement did not reflect the gift of equity as required or the equity gift amount was incorrect.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Graduation gift for 1st time homebuyer & diploma/transcripts not provided supporting graduation date" -> EXCEPTION [O-FRD-55979] Significance: Critical | AOR: Underwriter
              Exception Detail: A graduation gift was used as a source of funds for a first-time homebuyer and a diploma or transcripts were not provided to support the date of graduation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The grant funds are not submitted under borrower number 1" -> EXCEPTION [FRD-GrantSub] Significance: Critical | AOR: Underwriter
              Exception Detail: All grant funds must be submitted under borrower number 1 and grant funds show under borrower number 2.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The gift letter did not state the actual or the maximum amount of the gift funds or gift of equity" -> EXCEPTION [O-FRD-55981] Significance: Critical | AOR: Underwriter
              Exception Detail: The gift letter did not state the actual or the maximum amount of the gift funds or gift of equity.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Transfer of gift from donor acct to borr acct, closing agent, realtor or builder not documented" -> EXCEPTION [O-FRD-00232] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not document the transfer of gift funds from the donor's financial account to the borrower's account, closing agent, realtor or builder.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Graduation gift for 1st time homebuyer not deposited to borrower's acct w/in 90 days of graduation" -> EXCEPTION [O-FRD-55980] Significance: Critical | AOR: Underwriter
              Exception Detail: A graduation gift was used as a source of funds for a primary residence without verification that the gift funds were deposited into the borrower's account within 90 days of the date of graduation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Wedding gift funds not documented w/ marriage license &/or not deposited w/in 90 days of marriage" -> EXCEPTION [O-FRD-50464] Significance: Critical | AOR: Underwriter
              Exception Detail: Gift funds were received as a wedding gift from unrelated persons and/or relatives as a source of funds, one of the following requirements were not met, the subject is not a primary residence, a copy of the marriage license or certificate was not provided and/or the gift funds were not deposited in the borrower's account within 90 days of the date of the marriage license or certificate.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all gift and/or grant fund requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q3:
          CODE: O-FRD-16537
          TEXT: Were all additional general asset documentation requirements met?_x000D_
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Large deposit not from the borr's income, acceptable funds awarded to the borr, or eligible asset" -> EXCEPTION [O-FRD-58101] Significance: Critical | AOR: Underwriter
              Exception Detail: The source of a large deposit requiring verification was not from the borrower's income, acceptable funds awarded to the borrower, or an eligible asset type.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac'
            - "Yes, all additional general asset documentation requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'Freddie Mac'
        Q4:
          CODE: O-FNM-15339
          TEXT: Were all anticipated sales proceeds asset requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Anticipated sale proceeds calculated incorrectly for an owned home listed for sale but not yet sold" -> EXCEPTION [O-FNM-00278] Significance: Critical | AOR: Underwriter
              Exception Detail: The anticipated sales proceeds were calculated incorrectly for an owned home listed for sale but has not yet been sold.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Signed employee relocation buy-out agreement not in the file" -> EXCEPTION [O-FNM-51041] Significance: Critical | AOR: Underwriter
              Exception Detail: An employee relocation plan is part of the transaction without a copy of the executed buy-out agreement to document the source of funds in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Like-kind/1031 exchange assets not documented or not compliant with Internal Revenue Code Sect 1031" -> EXCEPTION [O-FNM-51040] Significance: Critical | AOR: Underwriter
              Exception Detail: Assets from a “like-kind exchange” were not properly documented and/or did not comply with Internal Revenue Code Section 1031.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Settlement statement documenting sufficient net cash proceeds from a property sale not in the file" -> EXCEPTION [O-FNM-51039] Significance: Critical | AOR: Underwriter
              Exception Detail: The proceeds from the sale of a current home needed to close the subject loan was not documented with a copy of the settlement statement documenting sufficient net cash proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all anticipated sales proceeds asset requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q5:
          CODE: O-FNM-15349
          TEXT: Were all anticipated savings and cash-on-hand asset requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Anticipated savings considered were unreasonable or calculated incorrectly" -> EXCEPTION [O-FNM-50265] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower's anticipated savings estimate was not reasonable and/or was not calculated as per guidelines.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all anticipated savings and cash-on-hand asset requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q6:
          CODE: O-FHA-16120
          TEXT: Were all net proceeds asset requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Sale of real prop not documented as arm's length trans & that borrower is entitled to net proceeds" -> EXCEPTION [O-FHA-57879] Significance: Major | AOR: Underwriter
              Exception Detail: The sale of real property was not documented as an arm's length transaction and that the borrower is entitled to the net sale proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Personal property sold-item value, bill of sale & borr's receipt/deposit of proceeds not documented" -> EXCEPTION [O-FHA-02266] Significance: Major | AOR: Underwriter
              Exception Detail: The file did not document the personal property sold to obtain cash for closing with an estimate of the value of the item, a copy of the bill of sale, evidence of receipt, and deposit of proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Net sale proceeds considered & not verified with a fully executed Closing Disclosure or similar" -> EXCEPTION [O-FHA-02268] Significance: Major | AOR: Underwriter
              Exception Detail: Funds from the sale of real property were considered, and the net sale proceeds were not documented and verified with a fully executed Closing Disclosure or similar legal document.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Evidence does not exist indicating the borrower is entitled to net proceeds" -> EXCEPTION [O-FHA-50018] Significance: Major | AOR: Underwriter
              Exception Detail: For Sale of Real Property, evidence does not exist indicating the borrower is entitled to net proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Yes, all net proceeds asset requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
        Q7:
          CODE: O-FRD-15496
          TEXT: Were all liquidation or sale of asset requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No evidence of liquidation for applicable accounts that are less than 20% of the amt needed to close" -> EXCEPTION [O-FRD-50461] Significance: Critical | AOR: Underwriter
              Exception Detail: Assets for closing are derived from stocks, bonds, mutual funds, U.S. government securities, retirement accounts or other securities that are less than 20% of the combined value of these assets without evidence of liquidation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Cryptocurrency was considered in the asset calculation to establish the DTI ratio" -> EXCEPTION [O-FRD-55523] Significance: Critical | AOR: Underwriter
              Exception Detail: Cryptocurrency was considered in the calculation of net eligible assets for establishing the debt payment-to-income ratio.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The file did not document that the cryptocurrency source of funds was exchanged for U.S. dollars" -> EXCEPTION [O-FRD-55522] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not document that the cryptocurrency source of funds was exchanged for U.S. dollars.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Sale proceeds not real estate/exchange-traded securities without a bill of sale or proof of receipt" -> EXCEPTION [O-FRD-00270] Significance: Critical | AOR: Underwriter
              Exception Detail: A source of the borrower’s funds is proceeds from the sale of an asset other than real estate or exchange-traded securities, the file does not contain a bill of sale and/or evidence of receipt of the proceeds.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Missing settlement/closing disclosure statement evidencing proceeds from the sale of real property" -> EXCEPTION [O-FRD-00265] Significance: Critical | AOR: Underwriter
              Exception Detail: A source of the borrower’s funds is the proceeds from the sale of real property, the file does not contain the settlement/closing disclosure statement.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Traded securities or vested stock used without 2 mos statements, VOD or alt document or as per LPA" -> EXCEPTION [O-FRD-00268] Significance: Critical | AOR: Underwriter
              Exception Detail: Securities that are exchange-traded assets or vested stock options are used to qualify, the file does not contain a stock/securities account statement, a VOD or other allowable alternative documentation for a 2-month period or as was required by LPA.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all liquidation or sale of asset requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q8:
          CODE: O-FNM-15350
          TEXT: Were all asset verification documentation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The bank statements provided are incomplete and/or missing all required pages" -> EXCEPTION [Bank Statements] Significance: Critical | AOR: Underwriter
              Exception Detail: The bank statements provided are incomplete/missing all required pages
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Depository assets were not documented as per DU" -> EXCEPTION [O-FNM-00217] Significance: Critical | AOR: Underwriter
              Exception Detail: Depository assets were not documented as per DU.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "All assets were not submitted to DU correctly" -> EXCEPTION [DUAssets] Significance: Critical | AOR: Underwriter
              Exception Detail: All assets were not submitted to DU correctly.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Borr was own realtor & the earned commission not on settlement stmt as a credit towards the mtg loan" -> EXCEPTION [O-FNM-56339] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower acted as their own real estate agent, and the earned commission was not reflected on the settlement statement as a credit towards the mortgage loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Earnest money deposit not entered correctly in DU based on if EMD cleared the borr's bank account" -> EXCEPTION [O-FNM-00218] Significance: Critical | AOR: Underwriter
              Exception Detail: The earnest money deposit was not entered correctly in DU based on whether or not the deposit has cleared the borrower's bank account.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The loan file did not document sufficient funds for closing" -> EXCEPTION [O-FNM-55916] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan file did not document sufficient funds for closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Virtual currency used as a source of funds was not verified in U.S. dollars prior to closing" -> EXCEPTION [O-FNM-55675] Significance: Critical | AOR: Underwriter
              Exception Detail: Virtual currency used as a source of funds was not verified in U.S. dollars prior to closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all asset verification documentation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q9:
          CODE: O-VA-14257
          TEXT: Does the file contain sufficient asset documentation for checking/savings?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "AUS UW-VOD or last 1 month bank statements do not verify funds on deposit" -> EXCEPTION [O-VA-03098] Significance: Critical | AOR: Underwriter
              Exception Detail: Where AUS is Accept/Approve, the file did not contain all required asset documentation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Manual UW-VOD or last 2 mos bank statements do not verify funds on deposit" -> EXCEPTION [O-VA-00208] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a VOD or the last 2 months bank statements as applicable in this manually underwritten loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all checking/savings asset requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q10:
          CODE: O-FHA-16541
          TEXT: Were all reserves/cash to close requirements met?_x000D_
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "All assets submitted to the AUS were not verified and documented" -> EXCEPTION [O-FHA-58117] Significance: Major | AOR: Underwriter
              Exception Detail: All assets submitted to the AUS were not verified and documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "One month's PITI reserves were not verified and documented for a 1-2 property in a manual UW" -> EXCEPTION [O-FHA-58118] Significance: Major | AOR: Underwriter
              Exception Detail: One month's PITI reserves were not verified and documented for a one- to two-unit property in a manual UW.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Rental income used for a 1 unit with an ADU & reserves equivalent to 2 months PITI were not verified" -> EXCEPTION [O-FHA-58115] Significance: Major | AOR: Underwriter
              Exception Detail: Rental income is being used for a one-unit with an ADU and reserves equivalent to two months of PITI were not verified and documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Three months PITI reserves were not verified and documented for a 3-4 unit property" -> EXCEPTION [O-FHA-58116] Significance: Major | AOR: Underwriter
              Exception Detail: Three months of PITI reserves were not verified and documented for a three- to four-unit property.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Yes, all reserves/cash to close requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
            - "Yes, all reserves/cash to close requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA'
        Q11:
          CODE: O-VA-14264
          TEXT: Does the file contain sufficient documentation for other assets?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "AUS Refer-sales price exceeds NOV without funds for the difference plus closing costs being verified" -> EXCEPTION [O-VA-51063] Significance: Critical | AOR: Underwriter
              Exception Detail: The AUS Refer where the sales price exceeds reasonable value established by the Notice of Value (NOV), funds for payment of any difference between sales price and loan amount plus closing costs was not verified.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Sufficient assets not documented to cover closing costs & any down payment if applicable" -> EXCEPTION [O-VA-50767] Significance: Critical | AOR: Underwriter
              Exception Detail: Sufficient assets not documented to cover closing costs and/or the down payment if applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Funds saved at home did not document reasonable explanation from the borrower of how money was saved" -> EXCEPTION [O-VA-00261] Significance: Critical | AOR: Underwriter
              Exception Detail: A source of funds is from cash saved at home; however, a reasonable explanation of how the borrower saved the funds is not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
