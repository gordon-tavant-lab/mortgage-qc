block_id: loan-documents-review
name: "Loan Documents Review"
description: "Verifies completeness and accuracy of loan file documents including purchase contracts, title commitments, surveys, and required third-party documentation."
category: loan-documents-review
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Loan Documents Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (33 questions):
        Q1:
          CODE: O-RHS-15692
          TEXT: Were all loan document requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No, it appears loan documents have been altered" -> EXCEPTION [O-RHS-02718] Significance: Critical | AOR: Underwriter
              Exception Detail: Credit qualifying documents were illegible and/or had evidence of alternations, erasures, white-outs, or similar indications that changes have been made.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "Escrow/closing or settlement instructions not in the file as applicable" -> EXCEPTION [O-RHS-50910] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain escrow/closing or settlement instructions as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "Actual cost to construct or rehab the subject in combination construction & perm loan not documented" -> EXCEPTION [O-RHS-51750] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain documentation of the actual cost to construct or rehabilitate the subject dwelling in a combination construction and permanent loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "No, the late charge exceeds the 5% maximum for USDA loans" -> EXCEPTION [O-RHS-50003] Significance: Critical | AOR: Underwriter
              Exception Detail: The late charge on the Note exceeds a rate that is reasonable and customary as governed by state law or 5%.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "Modification did not confirm permanent loan, amortizing rate, escrow bal not applied as curtailment" -> EXCEPTION [O-RHS-51749] Significance: Critical | AOR: Underwriter
              Exception Detail: The loan modification agreement did not confirm the existence of a permanent loan, amortizing interest rate and/or evidence that all funds remaining in the construction escrow or PITI reserve accounts have been applied as a principal curtailment.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "Note and/or Security Instrument form is not correct for the applicable transaction type" -> EXCEPTION [O-RHS-50014] Significance: Critical | AOR: Underwriter
              Exception Detail: The Note and/or Security Instrument type is not correct for the applicable mortgage type, lien type, property type, and/or product type for regularly amortizing government mortgages that are closed on the Fannie Mae/Freddie Mac uniform security instruments.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
            - "Yes, all loan document requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'USDA'
        Q2:
          CODE: O-FHA-15290
          TEXT: Were all sales contract and supporting documentation requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "92800.5B not provided prior to contract & amendatory clause not added to the contract prior to close" -> EXCEPTION [O-FHA-00025] Significance: Critical | AOR: Underwriter
              Exception Detail: Evidence the borrower received Form HUD-92800.5B, Conditional Commitment Direct Endorsement Statement of Appraised Value, prior to signing the sales contract was not in the file and the contract did not include an amendatory clause.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "Contract did not specify if PACE obligation will remain or be satisfied prior to or at closing" -> EXCEPTION [O-FHA-50636] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is encumbered with a PACE obligation, the sales contract did not include a clause specifying if the obligation will remain or be satisfied by the seller at, or prior to, closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "Evidence the PACE obligation was satisfied by the seller prior to or at closing not documented" -> EXCEPTION [O-FHA-50874] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not document that the seller satisfied the Property Assessed Clean Energy (PACE) obligation prior to or at closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "A Real Estate Certification was not in the file or included as a statement in the sales contract" -> EXCEPTION [O-FHA-00024] Significance: Critical | AOR: Underwriter
              Exception Detail: A Real Estate Certification was not in the file or included as a statement in the sales contract.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "Contract is incomplete, inaccurate &/or unsigned by all req'd parties including addendums" -> EXCEPTION [O-FHA-02624] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a copy of all signed sales contracts and/or including the final signed sales contract and all addendums or not all information was correct.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "Contract, addenda, and the Amendatory Clause not in file or unsigned by all parties" -> EXCEPTION [O-FHA-50716] Significance: Critical | AOR: Underwriter
              Exception Detail: The Sales/Purchase Contract, addenda, and the Amendatory Clause was not in the file and/or was not signed by all borrowers and sellers.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
            - "Yes, all sales contract and supporting documentation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase')
        Q3:
          CODE: Contract
          TEXT: Were all sales contract requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Unable to locate proof the signer on the contract is an authorized individual" -> EXCEPTION [ContractAuthSigner] Significance: Critical | AOR: Underwriter
              Exception Detail: Unable to locate proof those who signed the contract on a companies behalf is an authorized signer.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "All Massachusetts (MA) Title 5 Septic requirements have not been met" -> EXCEPTION [Sales Contract-2] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "All parties taking title to the property are not listed on the fully executed contract" -> EXCEPTION [Title Party] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "The sales contract indicates subject to completion or repairs, including safety, soundness or struct" -> EXCEPTION [Sales Contract-1] Significance: Critical | AOR: Underwriter
              Exception Detail: The sales contract indicates subject to completion or repairs, including safety, soundness or structual conditions inspections or environmental hazards including evidence if wood-boring insects, dampness, or settlement that has not been addressed by the appraiser?
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "Name of seller on sales contract does not match appraisal, HUD 1 and/or title commitment" -> EXCEPTION [SELLER NAME/CONTRACT] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
            - "Yes, all sales contract requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.LoanPurposeType = 'Purchase'
        Q4:
          CODE: O-FRD-15606
          TEXT: Were all Power of Attorney requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "A POA was used due to a borrower emergency without documenting the emergency in the file" -> EXCEPTION [O-FRD-53923] Significance: Critical | AOR: Closer
              Exception Detail: A Power of Attorney was used due to a borrower emergency without evidence of the emergency being documented in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "POA used and atty-in-fact is not familial, personal or other relationship to the borrower" -> EXCEPTION [O-FRD-50522] Significance: Critical | AOR: Closer
              Exception Detail: A POA was used, but the attorney-in-fact doesn't have a familial, personal or fiduciary relationship with the Borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "A Power of Attorney (POA) was used without the original POA being in the file" -> EXCEPTION [O-FRD-50521] Significance: Critical | AOR: Closer
              Exception Detail: A Power of Attorney (POA) was used without the original POA being in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The Power of Attorney was not notarized" -> EXCEPTION [O-FRD-53925] Significance: Critical | AOR: Closer
              Exception Detail: The Power of Attorney was not notarized.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "POA used in a cash-out refi without evidence the lender/closing agent had a pre-closing discussion" -> EXCEPTION [O-FRD-53924] Significance: Critical | AOR: Closer
              Exception Detail: A Power of Attorney was used due to a borrower emergency in a cash-out refinance without the file documenting the lender or settlement agent had a POA pre-closing discussion.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The file is missing documentation of the circumstances where the use of a POA is required by law" -> EXCEPTION [O-FRD-54569] Significance: Critical | AOR: Closer
              Exception Detail: The file did not include a written statement that explains the circumstances where the use of a POA is required by law.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Recorded POA not delivered with Note & file missing evidence delivery w/in 30 days after recording" -> EXCEPTION [O-FRD-54172] Significance: Critical | AOR: Closer
              Exception Detail: The Power of Attorney was recorded but not delivered with the Note and the file does not evidence it was delivered within 30 days of receipt from recording.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "POA pre-closing discussion waived w/out documenting the borr is in military service or incapacitated" -> EXCEPTION [O-FRD-54568] Significance: Critical | AOR: Closer
              Exception Detail: The Power of Attorney pre-closing discussion was waived without supporting documentation the borrower is in military service or is incapacitated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all Power of Attorney requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q5:
          CODE: O-FNM-15444
          TEXT: Were all contents of the application package requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "The file did not contain escrow/closing or settlement instructions as applicable" -> EXCEPTION [O-FNM-50907] Significance: Critical | AOR: Closer
              Exception Detail: The file did not contain escrow/closing or settlement instructions as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The final DU Underwriting Analysis Report was not in the file" -> EXCEPTION [O-FNM-50190] Significance: Critical | AOR: Closer
              Exception Detail: The final DU Underwriting Analysis Report was not in the file for this DU underwritten loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Note/Mtg & final 1003 signed by POA, no initial 1003 signed by the borr & POA doesn't meet exception" -> EXCEPTION [O-FNM-51639] Significance: Critical | AOR: Closer
              Exception Detail: Either the note or security instrument and the final 1003 was executed by a POA and the initial application was not in the file signed by the borrower and the POA does not meet circumstances for an exception.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The 1008/1077 or other similar document was incomplete, incorrect or not in file" -> EXCEPTION [O-FNM-00715] Significance: Critical | AOR: Closer
              Exception Detail: The 1008/1077, Uniform Underwriting and Transmittal Summary, or a similar document was incomplete, incorrect or not in the file for this manually underwritten loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all contents of the application package requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q6:
          CODE: O-FRD-15609
          TEXT: Were all co-op loan document requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The file did not contain a copy of the Proprietary Lease" -> EXCEPTION [O-FRD-59083] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a copy of the Proprietary Lease.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.PropertyType = 'Cooperative')
            - "The file did not contain a Co-op Corporation’s Recognition Agreement" -> EXCEPTION [O-FRD-53025] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain a Co-op Corporation’s Recognition Agreement.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.PropertyType = 'Cooperative')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.PropertyType = 'Cooperative')
            - "Yes, all co-op loan document requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac') AND (Loans.PropertyType = 'Cooperative')
        Q7:
          CODE: O-FHA-15287
          TEXT: Were all electronic document requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Third party documents signed electronically were not conducted in accordance with E-SIGN & UETA" -> EXCEPTION [O-FHA-54088] Significance: Critical | AOR: Underwriter
              Exception Detail: Third party documents signed electronically were not conducted in accordance with the E-SIGN Act and the Uniform Electronic Transactions Act.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "E-sign docs disclosure, consent, signature, presentation, delivery, retention & state req's not met" -> EXCEPTION [O-FHA-51636] Significance: Critical | AOR: Underwriter
              Exception Detail: Documents were electronically signed without meeting all requirements of the E-SIGN Act, including those relating to disclosures, consent, signature, presentation, delivery, retention and any state law met as applicable to the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The subject eNote did not contain an eNote clause" -> EXCEPTION [O-FHA-56107] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject eNote did not contain an eNote clause.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The file did not document the signers intent to sign for use of electronic signatures" -> EXCEPTION [O-FHA-54090] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not document the signer’s intent to sign for use of electronic signatures.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Electronic signatures were utilized that appear to have been involuntary" -> EXCEPTION [O-FHA-54089] Significance: Critical | AOR: Underwriter
              Exception Detail: Electronic signatures were utilized that appear to have been involuntary.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all electronic document requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q8:
          CODE: O-FNM-15440
          TEXT: Were all electronic records requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The eMortgage is ineligible due to being a special purpose product that req's add'l legal documents" -> EXCEPTION [O-FNM-51480] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is an ineligible eMortgage due to being a special purpose product that requires additional legal documents.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The eMortgage electronic records were not valid and enforceable" -> EXCEPTION [O-FNM-51481] Significance: Critical | AOR: Underwriter
              Exception Detail: The eMortgage electronic records were not valid and enforceable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The electronic record used was in audio or video format" -> EXCEPTION [O-FNM-53858] Significance: Critical | AOR: Underwriter
              Exception Detail: The electronic record used was in audio or video format.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all electronic records requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q9:
          CODE: O-RHS-15691
          TEXT: Were all electronic signature requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "The eMortgage electronic records were not valid and enforceable" -> EXCEPTION [O-RHS-51634] Significance: Critical | AOR: Closer
              Exception Detail: The eMortgage electronic records were not valid and enforceable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "E-sign docs disclosure, consent, signature, presentation, delivery, retention & state req's not met" -> EXCEPTION [O-RHS-51635] Significance: Critical | AOR: Closer
              Exception Detail: Documents were electronically signed without meeting all requirements of the E-SIGN Act, including those relating to disclosures, consent, signature, presentation, delivery, retention and any state law met as applicable to the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all electronic signature requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q10:
          CODE: ESIGN
          TEXT: Where an electronic signature was utilized prior to closing was the proper documentation obtained?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Processor
          RESPONSES:
            - "No, unable to locate the notice of completion confirming a valid signature" -> EXCEPTION [ESIGN] Significance: Major | AOR: Processor
              Exception Detail: Unable to locate the notice of completion confirming a valid signature
            - "Not Applicable" -> NOT_APPLICABLE
            - "Yes, proper documentation was obtained when an electronic signature was utilized" -> PASS
        Q11:
          CODE: O-FHA-15289
          TEXT: Were all document signing requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The electronic signature does not comply with FHA's electronic signature performance standard" -> EXCEPTION [O-FHA-02318] Significance: Critical | AOR: Underwriter
              Exception Detail: An electronic signature was used for FHA documents requiring a signature that did not meet Electronic Signature Performance Standards.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "There is evidence in the file that loan documents signed by the borrower were blank or incomplete" -> EXCEPTION [O-FHA-00002] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrowers were provided blank or incomplete documents to sign.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all document signing requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q12:
          CODE: O-FNM-15441
          TEXT: Were all electronic signature requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Processor
          RESPONSES:
            - "A single electronic signature was applied to multiple electronic records simultaneously" -> EXCEPTION [O-FNM-54102] Significance: Critical | AOR: Processor
              Exception Detail: A single electronic signature was applied to multiple electronic records simultaneously.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "E-sign docs disclosure, consent, signature, presentation, delivery, retention & state req's not met" -> EXCEPTION [O-FNM-51482] Significance: Critical | AOR: Processor
              Exception Detail: Documents were electronically signed without meeting all requirements of the E-SIGN Act, including those relating to disclosures, consent, signature, presentation, delivery, retention and any state law met as applicable to the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all electronic signature requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q13:
          CODE: O-VA-15766
          TEXT: Were all electronic document requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Closer
          RESPONSES:
            - "E-sign docs disclosure, consent, signature, presentation, delivery, retention & state req's not met" -> EXCEPTION [O-VA-51637] Significance: Critical | AOR: Closer
              Exception Detail: Documents were electronically signed without meeting all requirements of the E-SIGN Act, including those relating to disclosures, consent, signature, presentation, delivery, retention and any state law met as applicable to the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all electronic document requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q14:
          CODE: O-FHA-15288
          TEXT: Were all document handling requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "TPV of employment, income, assets or credit handled/transmitted through a interested party/borrower" -> EXCEPTION [O-FHA-53930] Significance: Critical | AOR: Underwriter
              Exception Detail: Third party verifications of employment, income, assets or credit documents were handled or transmitted through an interested party or the borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase'
            - "POA was used for an incapacitated borrower without meeting all eligibility requirements for use" -> EXCEPTION [O-FHA-53932] Significance: Critical | AOR: Underwriter
              Exception Detail: A Power of Attorney was used for an incapacitated borrower without meeting all eligibility requirements for use.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase'
            - "Internet documentation did not contain all required information and/or was not authenticated" -> EXCEPTION [O-FHA-00005] Significance: Critical | AOR: Underwriter
              Exception Detail: Documents obtained from an Internet website did not contain all required information and the document was not authenticated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE Loans.QC_Policy = 'FHA' AND Loans.LoanPurposeType = 'Purchase'
            - "POA was used for a member of the military without meeting all eligibility requirements for use" -> EXCEPTION [O-FHA-53931] Significance: Critical | AOR: Underwriter
              Exception Detail: A Power of Attorney was used for a member of the military without meeting all eligibility requirements for use.
