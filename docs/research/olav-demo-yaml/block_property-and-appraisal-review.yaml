            CRITICAL OUTPUT RULES:
            - In the EVIDENCE line, ALWAYS cite the exact tool name (get_appraisal, get_comparable_sales, get_cu_score, get_flood_determination) that returned each data point.
            - ALWAYS include the PDF page number where the data was found, in the format "(page N)" after each data point. Look for page numbers in the extraction data fields — each field has a citation with a page number.
            - NEVER reference sources by invented names like "loan summary", "system record", "top-level appraisal record".
            - If data came from the PDF documents in your input, cite it as "input_pdf_documents (page N)".
