block_id: income-verification
name: "Income Verification"
description: "Comprehensive income verification covering W-2, paystub, tax return, self-employment, rental, and other income sources. Validates income calculations, trending analysis, VVOE, and consistency with AUS findings."
category: income-verification
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Income Verification. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (111 questions):
        Q1:
          CODE: O-FRD-16181
          TEXT: Were all 1099 income requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "1099 income not averaged correctly using the documented history & expense reduction as applicable" -> EXCEPTION [O-FRD-56079] Significance: Critical | AOR: Underwriter
              Exception Detail: 1099 income average was not calculated correctly using the documented history and expense reduction as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "1099 income not documented as likely to continue for at least the next 3 years" -> EXCEPTION [O-FRD-56078] Significance: Critical | AOR: Underwriter
              Exception Detail: 1099 income not documented as likely to continue for at least the next 3 years.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "1099 income not documented with 2 years 1099's, YTD paystubs/equivalent & pgs 1 & 2 tax returns" -> EXCEPTION [O-FRD-56076] Significance: Critical | AOR: Underwriter
              Exception Detail: 1099 income not documented with 2 years 1099's, YTD paystubs and/or other equivalent and pages 1 and 2 of the individual tax returns.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "1099 income less than 2 yrs without a written analysis & documentation justifying stability" -> EXCEPTION [O-FRD-56077] Significance: Critical | AOR: Underwriter
              Exception Detail: 1099 income less than 2 year history not documented with a written analysis and sufficient supporting documentation justifying the determination of stability.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Schedule C 1099 expenses exceed 5% of gross receipts or sales after deducting non-cash expenses" -> EXCEPTION [O-FRD-56081] Significance: Critical | AOR: Underwriter
              Exception Detail: Schedule C 1099 total expenses exceed 5% of gross receipts or sales after deducting non-cash expenses.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Schedule C used for 1099 income is reported an amount for the cost of goods sold" -> EXCEPTION [O-FRD-56082] Significance: Critical | AOR: Underwriter
              Exception Detail: Schedule C used for 1099 income reported an amount for the cost of goods sold.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Schedule C gross receipts or sales do not equal to the total amount(s) reported on IRS Form 1099(s)" -> EXCEPTION [O-FRD-56080] Significance: Critical | AOR: Underwriter
              Exception Detail: Schedule C gross receipts or sales do not equal to the total amount(s) reported on IRS Form 1099(s).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Schedule C does not reflect a 12-month history of 1099 income and reported expenses" -> EXCEPTION [O-FRD-56083] Significance: Critical | AOR: Underwriter
              Exception Detail: Schedule C does not reflect a 12-month history of 1099 income and reported expenses.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all 1099 income requirements have been met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q2:
          CODE: O-FRD-15471
          TEXT: Were all income verification requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "VVOE or alternative missing or not dated w/in 10 business days of the Note &/or missing information" -> EXCEPTION [O-FRD-50428] Significance: Critical | AOR: Underwriter
              Exception Detail: The required VVOE or alternative document was not in the file, was not dated within 10 business days of the Note date, and/or did not provide all required information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Vendor for 3rd party VOE was not Equifax/TWN or manual process not followed" -> EXCEPTION [3rdParty] Significance: Critical | AOR: Underwriter
              Exception Detail: Vendor used for 3rd party VOE was not Equifax/TWN and the manual process was not followed to ensure borrower NPPI data was protected.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Necessary additional documentation not obtained to evaluate, justify and explain the qualification" -> EXCEPTION [O-FRD-55384] Significance: Critical | AOR: Underwriter
              Exception Detail: Necessary additional documentation was not obtained to evaluate, justify and explain the loan qualification.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Military leave & earnings stmt used to meet the 10 day PCV requirement not dated within 120 days" -> EXCEPTION [O-FRD-52178] Significance: Critical | AOR: Underwriter
              Exception Detail: A military leave and earnings statement was used to meet the 10-day PCV requirement that was not dated within 120 days.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Email verification as a VVOE alt not dated w/in 10 business days &/or did not include all req'd info" -> EXCEPTION [O-FRD-57987] Significance: Critical | AOR: Underwriter
              Exception Detail: The email verification used as a VVOE alternative was not dated within 10 business days and/or did not include all required information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "VOE for prior employment did not contain all required employment/earnings information" -> EXCEPTION [O-FRD-50427] Significance: Critical | AOR: Underwriter
              Exception Detail: One or more of the information requirements were not met for previous employment on the VOE, employment dates, position held and gross earnings.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Third-party 10-day PCV used and name/contact information for the service provider not documented" -> EXCEPTION [O-FRD-54339] Significance: Critical | AOR: Underwriter
              Exception Detail: A third-party 10-day pre-closing verifications (10-day PCVs) was used without documenting the name and contact information for the service provider.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Verification of income from 3rd party was used, but did not meet 3rd party verification requirements" -> EXCEPTION [O-FRD-00332] Significance: Critical | AOR: Underwriter
              Exception Detail: Employment and income verifications were obtained through a third-party verification service with information in the database that is more than 35 days old.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The verbal verification of employment does not show borrower in an active status" -> EXCEPTION [VVOE Inactive] Significance: Critical | AOR: Underwriter
              Exception Detail: The verbal verification of employment does not show borrower in an active status.  Not Active or Leave of absence is indicated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "VOE missing signature, printed name, title, contact info of the rep who verified the information" -> EXCEPTION [O-FRD-50424] Significance: Critical | AOR: Underwriter
              Exception Detail: The written VOE did not provide one or more of the following requirements, the signature, printed name, title and contact information of the employer representative who verified the information and the date completed and the borrower's name and employer's name and address.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "VOE did not provide all required employment & earning information for most recent 1 or 2 yr period" -> EXCEPTION [O-FRD-50425] Significance: Critical | AOR: Underwriter
              Exception Detail: The VOE did not provide one or more of the following; start date, current position, salary and/or hourly earnings, YTD earnings, earnings from either the most recent one or two-year calendar period.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "YTD paystub not last prior to Note date & paid through date over 15 business days prior to Note date" -> EXCEPTION [O-FRD-57379] Significance: Critical | AOR: Underwriter
              Exception Detail: The YTD paystub is not from the pay period immediately preceding the Note date and the "paid through" date and is more than 15 business days before the Note date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The required W2 or acceptable alternative was not in the file" -> EXCEPTION [O-FRD-50423] Significance: Critical | AOR: Underwriter
              Exception Detail: The required W2 or acceptable alternative was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "YTD paystub did not contain all identifying & earnings info required" -> EXCEPTION [O-FRD-50422] Significance: Critical | AOR: Underwriter
              Exception Detail: The YTD paystub was missing 1 or more of the following requirements, the employers name, identify the borrower as an employee, issue date, the time period covered, pay period dates, earnings, and the complete YTD earnings without obtaining additional documentation as needed for information not reflected on the YTD paystub(s).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all income verification requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q3:
          CODE: O-FRD-15481
          TEXT: Were all rental income requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "2-4 OO or 1-4 NOO schedule E or lease rent not supported by current market rents without comment" -> EXCEPTION [O-FRD-03168] Significance: Critical | AOR: Underwriter
              Exception Detail: Rental income from a 2-4 unit primary or 1-4 unit investment property was used however, the analysis did not support rental market viability and/or the current market rents did not reasonably support the gross rents reported on Schedule E or the gross monthly lease income without a written analysis explaining the discrepancy.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Lease unavail for 2-4 OO/1-4 NOO/non-subj inv bought/rented in last year missing Form 72 or Form 100" -> EXCEPTION [O-FRD-00413] Significance: Critical | AOR: Underwriter
              Exception Detail: The lease for a subject 2- to 4-unit primary, 1- to 4-unit investment property or non-subject investment property refinance transaction purchased or rented in the current calendar year was not available and Guide Form 72, Small Residential Income Appraisal Report, or Form 1000, Single Family Comparable Rent Schedule, as applicable was not used.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Form 72/1000 or 2 mos rent/deposit & 1st mos rent multi unit/non-subj invest bought/rented last yr" -> EXCEPTION [O-FRD-00414] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain documentation verifying receipt of two months of rental payments or receipt of the security deposit and the first month's rental payment for a subject 2- to 4-unit primary, 1- to 4-unit investment property, primary conversion to an investment, or non-subject investment property refinance transaction purchased or rented in the current calendar year.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Rental income eligibility &/or continuance req's not met as applicable per property/occupancy types" -> EXCEPTION [O-FRD-00412] Significance: Critical | AOR: Underwriter
              Exception Detail: Rental income used to qualify did not meet the general eligibility and/or continuance requirements as applicable per property and occupancy types.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "File did not document the req'd property management experience for investment property rental income" -> EXCEPTION [O-FRD-03171] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower did not meet the required investment management experience of 1 year history and/or was not documented with the applicable tax return for the rental income used to qualify.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "The amount of rental income relied on is not within the maximum allowable net rental income" -> EXCEPTION [O-FRD-03172] Significance: Critical | AOR: Underwriter
              Exception Detail: The percentage of net rental income used exceeded the maximum allowed as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Existing lease in a purchase was not current & fully executed in the seller's name as the landlord" -> EXCEPTION [O-FRD-57501] Significance: Critical | AOR: Underwriter
              Exception Detail: In a purchase transaction, the existing lease was not current and fully executed in the property seller's name as the landlord.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Purchase or rental start in last year & no purchase or conversion date &/or lease not used in refi" -> EXCEPTION [O-FRD-03170] Significance: Critical | AOR: Underwriter
              Exception Detail: Rental income used in subject refinance where the prior purchase or start as rental property is within the last calendar year, the purchase or conversion date was not documented and/or a lease was not used to determine rental income.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Rental income from live-in-aide and documentation verifying income meets guidelines was not provided" -> EXCEPTION [O-FRD-00411] Significance: Critical | AOR: Underwriter
              Exception Detail: A borrower with a disability is receiving rental income from a live-in aide at their 1-unit primary or an accessory unit, evidence the rental income has been received for the last 12 months not in the file and/or the rental income calculation exceeded 30% of the total income used to qualify.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "No lease with reasonable efforts determining lease availability or Form 72/1000 in a purchase" -> EXCEPTION [O-FRD-03169] Significance: Critical | AOR: Underwriter
              Exception Detail: Rental income in a purchase transaction did not contain a lease with evidence that reasonable efforts were made to determine lease availability or Form 72 or 1000 as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all rental income requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q4:
          CODE: O-FHA-15176
          TEXT: Were all employment income requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Vendor for 3rd party VOE was not Equifax/TWN or manual process not followed" -> EXCEPTION [3rdParty] Significance: Critical | AOR: Underwriter
              Exception Detail: Vendor used for 3rd party VOE was not Equifax/TWN and the manual process was not followed to ensure borrower NPPI data was protected.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Alternative employment req's not met w/ most recent YTD paystub, 2 years W2s & a completed VVOE" -> EXCEPTION [O-FHA-55588] Significance: Critical | AOR: Underwriter
              Exception Detail: Alternative employment documentation requirements were not met with the most recent YTD paystub, 2 years W2 forms and a fully completed VVOE.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Not same employer for 2 yrs and no direct verification without meeting all req's for 2 yr history" -> EXCEPTION [O-FHA-51274] Significance: Critical | AOR: Underwriter
              Exception Detail: A direct verification of the past 2 years employment history was not obtained, and the following requirements were not met, 2 years with current employer, only base pay used and an executed IRS 4506/8821.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Data on the electronic reverification of employment was not current w/in 30 days of the verification" -> EXCEPTION [O-FHA-51273] Significance: Critical | AOR: Underwriter
              Exception Detail: The data provided on the electronic reverification of employment was not current within 30 days of the verification.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Not the same employer for 2 yrs & 1 or more acceptable documents verifying 2 yr history not in file" -> EXCEPTION [O-FHA-55591] Significance: Critical | AOR: Underwriter
              Exception Detail: The applicant has not been employed with the same employer for the previous 2 years and the did not contain one or more acceptable employment documents verifying a 2 year history.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Direct verification of the borrower's prior 2 years employment history was not obtained as required" -> EXCEPTION [O-FHA-02276] Significance: Critical | AOR: Underwriter
              Exception Detail: Direct verification of the borrower’s employment history for the previous two years was required but not documented in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "No direct verif of past employment & no 2 yr confirm by current employer or paystub w/ hiring date" -> EXCEPTION [O-FHA-55590] Significance: Critical | AOR: Underwriter
              Exception Detail: A direct verification of past employment was not provided and the file did not document confirmation of 2 years employment by the current employer or a paystub with a hiring date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Reverification of employment or VVOE was not in the file or not within 10 days of Note date" -> EXCEPTION [O-FHA-50022] Significance: Critical | AOR: Underwriter
              Exception Detail: A re-verification of employment or verbal VOE was not in the file or not completed within 10 days prior to the Note date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Traditional employment req's not met w/ a paystub & 2 year VOE or direct electronic VOE by a TPV" -> EXCEPTION [O-FHA-55587] Significance: Critical | AOR: Underwriter
              Exception Detail: Traditional employment documentation requirements not met with a paystub and a 2 year VOE or direct electronic verification of employment by a TPV.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "A VOE or alternative documentation acceptable to FHA covering the last 2 years was not in the file" -> EXCEPTION [O-FHA-50021] Significance: Critical | AOR: Underwriter
              Exception Detail: The file does not contain a VOE or alternative documentation acceptable to FHA covering the last 2 years.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "The verbal verification of employment does not show borrower in an active status" -> EXCEPTION [VVOE Inactive] Significance: Critical | AOR: Underwriter
              Exception Detail: The verbal verification of employment does not show borrower in an active status.  Not Active or Leave of absence is indicated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "No direct verification of past employment & OT, bonus &/or tip income used in lieu of only base pay" -> EXCEPTION [O-FHA-55589] Significance: Critical | AOR: Underwriter
              Exception Detail: A direct verification of past employment was not provided and the income considered included overtime, bonus and/or tip income in lieu of only base pay.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all   employment income requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q5:
          CODE: O-FNM-15319
          TEXT: Were all verbal verification of employment requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Vendor for 3rd party VOE was not Equifax/TWN or manual process not followed" -> EXCEPTION [3rdParty] Significance: Critical | AOR: Underwriter
              Exception Detail: Vendor used for 3rd party VOE was not Equifax/TWN and the manual process was not followed to ensure borrower NPPI data was protected.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Missing employer work email exchange dated within 10 business days PTC for alternative VOE method" -> EXCEPTION [O-FNM-55906] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain an email exchange with the borrower's employer from the employer's work email address within 10 business days prior to closing for an alternative VOE method.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "File did not confirm the employer email address is accurate for an alternative VOE method" -> EXCEPTION [O-FNM-55907] Significance: Critical | AOR: Underwriter
              Exception Detail: Alternative method VOE did not document due diligence was conducted to confirm the email address for the employer is accurate.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Alternative VOE method employer email did not include all required information" -> EXCEPTION [O-FNM-55908] Significance: Critical | AOR: Underwriter
              Exception Detail: The alternative VOE method employer email did not include the borrower’s name, title, employer verifier work email address, date of contact and borrower’s current employment status.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "VVOE not obtained or not dated within 120 calendar days of the note date for self-employed income" -> EXCEPTION [O-FNM-53031] Significance: Critical | AOR: Underwriter
              Exception Detail: A verbal verification of employment, VVOE, was not obtained or was not dated within 120 calendar days of the note date for self-employed income.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Third-party vendor database data used to obtain the VVOE was older than 35 days of the note date" -> EXCEPTION [O-FNM-52165] Significance: Critical | AOR: Underwriter
              Exception Detail: A third-party vendor database was used to obtain the verbal verification of employment and the data was older than 35 days old as of the note date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The verbal verification of employment does not show borrower in an active status" -> EXCEPTION [VVOE Inactive] Significance: Critical | AOR: Underwriter
              Exception Detail: The verbal verification of employment does not show borrower in an active status.  Not Active or Leave of absence is indicated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "A VVOE was not obtained or was not dated within 10 business days of the note date" -> EXCEPTION [O-FNM-00351] Significance: Critical | AOR: Underwriter
              Exception Detail: A verbal verification of employment, VVOE, was not obtained or was not dated within 10 business days of the note date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "VVOE alt bank stmnts not within 15 business days before the note &/or do not contain all req'd info" -> EXCEPTION [O-FNM-57389] Significance: Critical | AOR: Underwriter
              Exception Detail: The bank statements used as a VVOE alternative are not within 15 business days before the note date and/or do not contain all required information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "VVOE alt paystub not within 15 business days before the note &/or does not contain all req'd info" -> EXCEPTION [O-FNM-57388] Significance: Critical | AOR: Underwriter
              Exception Detail: The paystub used as a VVOE alternative is not within 15 business days before the note date and/or does not contain all required information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all verbal verification of employment requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Verif from 3rd-party vendor not obtained to confirm borr's current employment status w/in 10days" -> EXCEPTION [PB-55906] Significance: Critical | AOR: Underwriter
              Exception Detail: Written verification from the vendor was not obtained to confirm the borrowers current employment status when a third-party employment was utilized within 10 days.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q6:
          CODE: O-RHS-15632
          TEXT: Were all wage earner income requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Vendor for 3rd party VOE was not Equifax/TWN or manual process not followed" -> EXCEPTION [3rdParty] Significance: Critical | AOR: Underwriter
              Exception Detail: Vendor used for 3rd party VOE was not Equifax/TWN and the manual process was not followed to ensure borrower NPPI data was protected.
