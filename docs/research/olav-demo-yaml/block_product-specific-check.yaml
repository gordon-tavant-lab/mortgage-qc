block_id: product-specific-check
name: "Product-Specific Check"
description: "Performs product-specific eligibility and guideline checks for conventional, FHA, VA, and USDA loan products including LTV limits, credit score requirements, and investor overlays."
category: product-specific-check
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Product-Specific Check. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (119 questions):
        Q1:
          CODE: O-VA-15755
          TEXT: Were all New Construction/Construction Permanent Home Loan requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "VA LAPP new construction file did not document enrollment in a 10-year insured protection plan" -> EXCEPTION [O-VA-00792] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject VA LAPP new construction file did not document that the property is or will be enrolled in a 10-year insured protection plan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Missing no construction warranty where Veteran borr is general contractor building subject primary" -> EXCEPTION [O-VA-00470] Significance: Critical | AOR: Underwriter
              Exception Detail: The veteran borrower is acting as the general contractor in building their primary residence without the file containing all required documentation including a signed acknowledgment that no construction warranty is provided and that VA will not assist with any construction defects.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "New construction missing exhibits including 1992 CABO Model Energy Code (MEC) as applicable" -> EXCEPTION [O-VA-00489] Significance: Critical | AOR: Underwriter
              Exception Detail: The property is considered new construction without the construction exhibits including compliance with the 1992 Council of American Building Officials (CABO) Model Energy Code (MEC) as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Escrow of completion holdback was inappropriate &/or the home not suitable for immediate occupancy" -> EXCEPTION [O-VA-51064] Significance: Critical | AOR: Underwriter
              Exception Detail: The escrow of completion holdback amount was not appropriate and/or the dwelling was incomplete and not suitable for immediate occupancy.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Constr/constr perm loan- Written approval from the borr prior to each draw pymt not evident" -> EXCEPTION [O-VA-50774] Significance: Critical | AOR: Underwriter
              Exception Detail: Evidence written approval from the borrower was obtained prior to each draw payment is provided to the builder not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "VA construction compliance inspection req's not met per stage in proposed/under construction" -> EXCEPTION [O-VA-00481] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is proposed or under construction, VA’s construction compliance inspection requirements were not met per stage as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Missing satisfactory inspection for required completion, repairs, alterations or conditions" -> EXCEPTION [O-VA-00642] Significance: Critical | AOR: Underwriter
              Exception Detail: The appraisal was made subject to completion per plans and specifications, repairs, alterations or conditions, an inspection certifying that the repairs have been satisfactorily completed was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Model home used to obtain value without stating the model home is the same plan type as the subject" -> EXCEPTION [O-VA-00480] Significance: Critical | AOR: Underwriter
              Exception Detail: The appraiser used a model home to obtain value for the subject without providing a statement that the model home is the same plan type as the subject.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Veteran not given Form 26-1859, Warranty of Completion of Construction or 10 yr insurance warranty" -> EXCEPTION [O-VA-51186] Significance: Critical | AOR: Underwriter
              Exception Detail: On a new construction property, the Veteran was not provided with a 1-year warranty on VA Form 26-1859, Warranty of Completion of Construction, or a 10-year insurance backed warranty.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "An escrow of funds for postponed completion of improvements not established as required" -> EXCEPTION [O-VA-51731] Significance: Critical | AOR: Underwriter
              Exception Detail: Escrow funds were not established for postponed completion of improvements without meeting the requirements to not need a completion escrow.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Missing Vet acknowledgement that 1 yr builder warranty or 10 yr insured protection plan not provided" -> EXCEPTION [O-VA-00485] Significance: Critical | AOR: Underwriter
              Exception Detail: The builder is not providing either a one-year builder’s warranty or a ten-year insured protection plan and the required written acknowledgement from the Veteran purchaser is not in the file to qualify for an exception.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all New Construction/Permanent Home Loan requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q2:
          CODE: O-FHA-15268
          TEXT: In a Section 251 Adjustable Rate Mortgage (ARM) transaction, were all requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "1 yr ARM with LTV of 95% or more, does not qualify with initial interest rate plus 1% point" -> EXCEPTION [O-FHA-00599] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is a 1-year ARM with an LTV of 95% or more, the mortgage was not underwritten based on payments calculated using the initial interest rate plus one percent.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Incorrect initial interest rate/margin per ARM type &/or initial interest rate adjustment incorrect" -> EXCEPTION [O-FHA-51054] Significance: Critical | AOR: Underwriter
              Exception Detail: The initial interest rate and the margin was established incorrectly as per the ARM type and/or the initial interest rate adjustment was incorrect.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all Section 251 Adjustable Rate Mortgage (ARM) requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q3:
          CODE: O-FRD-15560
          TEXT: Were all Adjustable Rate (ARM) term requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "3/6 month SOFR ARM qualifying rate not equal to the Note rate plus Life Cap (5%)" -> EXCEPTION [O-FRD-54602] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is a 3/6 month SOFR ARM ATR covered transaction and the qualifying rate used is not the Note rate plus Life Cap (5%).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "5/6 month SOFR ARM qualifying rate not equal to  greater of Note Rate + 2% or fully indexed rate" -> EXCEPTION [O-FRD-54603] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject is a 5/6 month SOFR ARM ATR covered transaction and the qualifying rate used was not the greater of the Note rate plus 2% or the fully indexed rate.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "7/6 or 10/6 month HPCT/HPML SOFR ARM, qualifying rate not greater of Note Rate or fully indexed rate" -> EXCEPTION [O-FRD-54605] Significance: Critical | AOR: Underwriter
              Exception Detail: The qualifying rate used was not the greater of the Note rate or the fully indexed rate in a 7/6 or 10/6 month SOFR ARM ATR covered transaction that is a higher-priced covered transaction (HPCT) or higher priced mortgage loan (HPML).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "7/6 or 10/6 month SOFR ARM that is not HPCT/HPML, qualifying rate not equal to the Note Rate" -> EXCEPTION [O-FRD-54604] Significance: Critical | AOR: Underwriter
              Exception Detail: The qualifying rate used was not the Note rate in a 7/6 or 10/6 month SOFR ARM ATR covered transaction that is not a higher-priced covered transaction (HPCT) or higher priced mortgage loan (HPML).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "SOFR ARM 3/6, 5/6, 7/6 or 10/6 initial fixed rate period is not 36, 60, 84 or 120 mos as applicable" -> EXCEPTION [O-FRD-55096] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject 3/6, 5/6, 7/6 or 10/6 month SOFR ARM initial fixed interest rate period is not 36, 60, 84 or 120 months as applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all Adjustable Rate (ARM) term requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q4:
          CODE: O-FRD-15561
          TEXT: Where the loan is a Section 502 GRH Mortgage, were all requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "All requirements not complied with for a Section 502 GRH Mortgage" -> EXCEPTION [O-FRD-50373] Significance: Critical | AOR: Underwriter
              Exception Detail: This Section 502 GRH Mortgage did not comply with all of the requirements of the Guaranteed Regulations and the Lender Agreement and documentation that these requirements were modified or waived in writing by RHS, and approved by Freddie Mac was not provided.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all Section 502 GRH requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
        Q5:
          CODE: O-FNM-15410
          TEXT: In a purchase transaction, were all eligibility requirements  met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "All additional requirements not met based on LTV and/or loan type" -> EXCEPTION [O-FNM-50202] Significance: Critical | AOR: Underwriter
              Exception Detail: Not all of the requirements were met for a purchase loan with an LTV, CLTV or HCLTV that exceeds 95%
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Sufficient funds to meet minimum contribution from acceptable source not documented and/or verified" -> EXCEPTION [O-FNM-00725] Significance: Critical | AOR: Underwriter
              Exception Detail: The minimum borrower contribution requirements were not met for the selected mortgage loan type.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not all Non-Arm's length requirements were met for existing or new homes" -> EXCEPTION [O-FNM-50203] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject loan was a Non-Arm's Length Transaction that did not meet all requirements.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Seller tax credit included in funds to close that does not meet exception to offset the escrow acct" -> EXCEPTION [O-FNM-54035] Significance: Critical | AOR: Underwriter
              Exception Detail: A seller provided real estate tax credit where real estate taxes are paid in arrears was included in determining sufficient funds to close but did not meet the exception to offset funds needed to establish the escrow account.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The purchase price &/or any earnest money deposit was designated in virtual currency" -> EXCEPTION [O-FNM-55679] Significance: Critical | AOR: Underwriter
              Exception Detail: The purchase price of the property and/or any earnest money deposit was designated in virtual currency.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The borrower(s) received cash back in an amount exceeding purchase money transaction guidelines" -> EXCEPTION [O-FNM-00829] Significance: Critical | AOR: Underwriter
              Exception Detail: Proceeds received from a purchase transaction were not applied in an approved use.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Evidence all parties agreed to the terms of the short sale/pre-foreclosure" -> EXCEPTION [O-FNM-50204] Significance: Critical | AOR: Underwriter
              Exception Detail: An approved form or other alternative was not provided to document that all parties agreed with the final details of the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Evidence all parties agreed to the terms of the short sale/preforeclosure" -> EXCEPTION [O-FNM-50204] Significance: Critical | AOR: Underwriter
              Exception Detail: An approved form or other alternative was not provided to document that all parties agreed with the final details of the transaction.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The purchase agreement indicates personal property and/or repairs are included in the purchase price" -> EXCEPTION [UW-Documentation3] Significance: Critical | AOR: Underwriter
              Exception Detail: Sales contract indicates personal property is included in the sales price.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all purchase transaction eligibility requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Sales contract lists personal property included in the sales price & no comment from appraiser found" -> EXCEPTION [PB-Sales Contract] Significance: Critical | AOR: Underwriter
              Exception Detail: Sales contract indicates personal property is included in the sales price and the appraiser did not comment that personal property was not included in the value.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q6:
          CODE: O-VA-15747
          TEXT: Were all Interest Rate Reduction Refinancing Loans (IRRRLs) borrower requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The IRRRL borrower(s) are not the same as on the original loan & is not an acceptable life event" -> EXCEPTION [O-VA-54254] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower(s) on the IRRRL is not the same as the original loan, and the acceptability of the IRRRL is not based on an acceptable life event.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "The transaction involves cash proceeds to the borrower or payoff of impermissible debts" -> EXCEPTION [O-VA-00647] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower received cash back in an IRRRL refinance that was not reimbursement for energy efficiency improvements up to $6,000 completed within 90 days of closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Missing Veteran's cert of occupancy 1820 that they previously occupied the property as their home" -> EXCEPTION [O-VA-57882] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain the Veteran's certification of occupancy that they previously occupied the property as their home.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "IRRRL surviving spouse funding fee exemption without documenting receipt of DIC & VA Form 26-8937" -> EXCEPTION [O-VA-57253] Significance: Critical | AOR: Underwriter
              Exception Detail: IRRRL surviving spouse funding fee exemption without documenting receipt of DIC and VA Form 26-8937, Verification of VA Benefits.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "In an IRRRL transaction, a final signed Veteran's Statement was not in the file" -> EXCEPTION [O-VA-50922] Significance: Critical | AOR: Underwriter
              Exception Detail: In an IRRRL transaction, a final signed Veteran's Statement was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all Interest Rate Reduction Refinancing Loans (IRRRLs) borrower requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q7:
          CODE: O-RHS-15688
          TEXT: Were all additional combination construction to permanent (single-close) loan requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Single-close credit document(s) exceed age requirements as of the actual/scheduled closing date" -> EXCEPTION [O-RHS-02707] Significance: Critical | AOR: Underwriter
              Exception Detail: There were single-close mortgage credit and/or verification documents older than 120 days of the original closing date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "The file did not contain the closing statement and/or it was incorrect" -> EXCEPTION [O-RHS-50599] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not contain the closing statement and/or was incorrect.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "A draw and disbursement ledger was not in the file if applicable" -> EXCEPTION [O-RHS-50595] Significance: Critical | AOR: Underwriter
              Exception Detail: A draw and disbursement ledger was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Not all of the loan costs were eligible in a rehabilitation & repair loan" -> EXCEPTION [O-RHS-52818] Significance: Critical | AOR: Underwriter
              Exception Detail: Not all of the loan costs were eligible in a rehabilitation & repair loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Excess construction proceeds given as cash back and not applied as a principal reduction" -> EXCEPTION [O-RHS-50597] Significance: Critical | AOR: Underwriter
              Exception Detail: Excess funds from the construction proceeds were not applied to reduce the principal balance of the permanent loan if applicable and/or the borrower received as cash back.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Subject included rehab & repair feature w/ financed amt for non-structural repairs exceeding $75,000" -> EXCEPTION [O-RHS-51848] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject included a rehab and repair feature with a financed amount for non-structural repairs exceeding $75,000.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Subject not habitable w/in 30 days of closing w/ a rehab & repair feature for non-structural repairs" -> EXCEPTION [O-RHS-59185] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject was not considered habitable within 30 days of closing with a rehab and repair feature for non-structural repairs.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "A rehab and repair feature without documenting the home has been complete for 12 months or more" -> EXCEPTION [O-RHS-51849] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject has a rehab and repair feature without documentation that the home had been completed for at least 12 months.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Structural repairs over $75,000 did not meet habitable timeline for PITI reserves w/o an extension" -> EXCEPTION [O-RHS-59184] Significance: Critical | AOR: Underwriter
              Exception Detail: The subject included a rehab and repair feature for structural repairs exceeding $75,000 that did not meet the post-closing 10 months (or as deemed by a third-party inspector) habitable timeline for PITI reserves without an approved extension.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "No, the guarantee fee was not collected prior to submission of request for guarantee" -> EXCEPTION [O-RHS-02708] Significance: Critical | AOR: Underwriter
              Exception Detail: For a single-close mortgage, it was not evident that the guarantee fee was collected prior to requesting the guarantee.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "File did not validate construction cost: contracts, loan agreement, plans, receipts, invoices, etc." -> EXCEPTION [O-RHS-02706] Significance: Critical | AOR: Underwriter
              Exception Detail: Sufficient documentation was not in the file to validate the actual cost to construct the subject home (for example, purchase contracts with the builder, Construction Loan Agreement, plans and specifications, receipts, invoices, lien waivers, etc.)
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, all additional combination construction to permanent (single-close) requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q8:
          CODE: O-FNM-15422
          TEXT: In a refinance transaction, were all prohibited practices requirements  met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Seller/servicer advanced pymts for the borr to then to refi after agreed pymts were advanced" -> EXCEPTION [O-FNM-55627] Significance: Critical | AOR: Underwriter
              Exception Detail: There are indicators of a refinancing arrangement that call for the seller/servicer to advance a number of payments on the borrower’s behalf and then to refinance the mortgage once the agreed-upon payments have been advanced.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "A CO refi with a note date 30 days or less before the application date of the subject LCO refi" -> EXCEPTION [O-FNM-55110] Significance: Critical | AOR: Underwriter
              Exception Detail: The borrower completed a cash-out refinance with a note date that was 30 days or less before the application date of the subject limited cash-out loan.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "There are indicators that the refinance was the result of a conditional tender of payment procedure" -> EXCEPTION [O-FNM-55628] Significance: Critical | AOR: Underwriter
              Exception Detail: There are indicators that the refinance was the result of a conditional tender of payment procedure.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "There are indicators the lender specifically targeted the Fannie Mae borrower to offer a refinance" -> EXCEPTION [O-FNM-55626] Significance: Critical | AOR: Underwriter
              Exception Detail: There are indicators that the lender specifically targeted the Fannie Mae borrower to offer a refinance.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "There are indicators in the file that the subject refinance is a prearranged refinancing agreement" -> EXCEPTION [O-FNM-55109] Significance: Critical | AOR: Underwriter
              Exception Detail: There are indicators in the loan file that the subject refinance had a prearranged refinancing agreement between the seller/servicer or affiliated TPO and the borrower.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all refinance transaction prohibited practices requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q9:
          CODE: O-VA-15757
          TEXT: Were all Alternations and Repairs loan requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Alteration/repair loan, subject not owned & occupied or made to purchase the property" -> EXCEPTION [O-VA-50775] Significance: Critical | AOR: Underwriter
              Exception Detail: The residence is not already owned and occupied as a home or made in conjunction with a purchase loan on the property as required for an alteration and repair loan program.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Yes, all Alternations and Repairs loan requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q10:
          CODE: O-VA-15929
          TEXT: Were all additional New Construction/Construction Permanent Home Loan requirements met?
          SIGNIFICANCE: Major
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The appraisal was not ordered with the applicable loan use and/or building status" -> EXCEPTION [O-VA-58003] Significance: Major | AOR: Underwriter
              Exception Detail: The appraisal was not ordered with the applicable loan use and/or building status.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "The appraisal was not ordered with the applicable loan use and/or building status." -> EXCEPTION [O-VA-58003] Significance: Major | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Veteran chose their own builder & a VA Builder ID was not obtained prior to the issuance of the NOV" -> EXCEPTION [O-VA-58000] Significance: Major | AOR: Underwriter
              Exception Detail: The Veteran chose their own builder and a VA Builder ID was not obtained prior to the issuance of the Notice of Value (NOV).
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "All construction exhibits including the survey/plot plan, plans & specs & elevations not in the file" -> EXCEPTION [O-VA-55508] Significance: Major | AOR: Underwriter
              Exception Detail: The file did not contain all construction exhibits including the survey/plot plan, plans and specifications and exterior elevations.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
