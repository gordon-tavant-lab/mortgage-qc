block_id: information-integrity
name: "Information Integrity Review"
description: "Evaluates loan file information integrity including data consistency across documents, fraud indicators, misrepresentation patterns, and undisclosed information."
category: information-integrity
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Information Integrity Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (16 questions):
        Q1:
          CODE: O-FNM-15408
          TEXT: Were all QC reverification requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Unable to obtain transcripts due to address on form not matching address in IRS records" -> EXCEPTION [4506CAddress] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Unable to obtain business transcripts due to missing 4506-C form for each business used to qualify" -> EXCEPTION [4506CBusiness] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Unable to obtain transcripts due to form not completed correctly (incorrect boxes checked on form)" -> EXCEPTION [4506CIncorrect] Significance: Critical | AOR: Underwriter
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC asset reverification did not validate funds as submitted" -> EXCEPTION [O-FNM-50341] Significance: Critical | AOR: Underwriter
              Exception Detail: A reverification of the borrower's assets was returned indicating discrepancies from the information submitted.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC review credit report did not support the original credit report" -> EXCEPTION [O-FNM-50342] Significance: Critical | AOR: Underwriter
              Exception Detail: The review credit report ordered as part of QC or reverification of non-traditional credit references contained discrepancies from the original credit analyzed during origination.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC employment/income reverification did not validate income/employment as submitted" -> EXCEPTION [O-FNM-50340] Significance: Critical | AOR: Underwriter
              Exception Detail: A reverification of the borrower's employment/income was returned indicating discrepancies from the information submitted.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC reverification of the gift from the gift donor did not support the original information/amount" -> EXCEPTION [O-FNM-59420] Significance: Critical | AOR: Underwriter
              Exception Detail: The QC reverification of the gift returned from the gift donor did not support the original information/amount.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC credit report does not show HELOC paid & closed" -> EXCEPTION [HelocPayClose] Significance: Critical | AOR: Underwriter
              Exception Detail: QC Credit report shows HELOC was not paid and closed as required.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC review of insurance & other documents do not support owner occupancy" -> EXCEPTION [O-FNM-50343] Significance: Critical | AOR: Underwriter
              Exception Detail: The property insurance policy and other documentation in the file did not support the borrower's intent to occupy.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "A signed blanket authorization form to reverify credit information was not in the file" -> EXCEPTION [O-FNM-50193] Significance: Critical | AOR: Underwriter
              Exception Detail: A signed blanket authorization form to reverify credit information was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC reverif of 3rd-party asset report from the provider didn’t support original data used to qualify" -> EXCEPTION [O-FNM-59419] Significance: Critical | AOR: Underwriter
              Exception Detail: The QC reverification of the asset report from the third-party asset report provider did not support the original data used for qualification.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The review appraisal or desk review of the appraisal did not support the original appraised value" -> EXCEPTION [O-FNM-50346] Significance: Critical | AOR: Underwriter
              Exception Detail: The review appraisal or desk review of the appraisal did not support the original appraised value.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "SS, retirement/disability income not re-verified &/or reverification did not confirm info as correct" -> EXCEPTION [O-FNM-51735] Significance: Critical | AOR: Underwriter
              Exception Detail: The Social Security retirement/disability income was not reverified with the applicable source and/or did not confirm all information was correct.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "QC Tax transcripts reverification did not validate income as submitted" -> EXCEPTION [O-FNM-50339] Significance: Critical | AOR: Underwriter
              Exception Detail: IRS tax transcripts were obtained as part of the QC reverification process that revealed discrepancies from the information provided during the approval process.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Tax transcripts show discrepancies, or rejected due to IRS code 10" -> EXCEPTION [TaxTranscriptsSI] Significance: Critical | AOR: Underwriter
              Exception Detail: The tax transcripts received by PCQC do not validate the income used to qualify, show discrepancies, or were rejected due to IRS Rejection code 10 which require additional due diligence._x000D_
      _x000D_
      Analyst: be sure to escalate for referral to SI.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not all QC Reverifications have been received at this time" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all QC reverification requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Most recent tax return not filed & IRS Form 4868 and estimated income taxes not in the file" -> EXCEPTION [PB-54125] Significance: Critical | AOR: Underwriter
              Exception Detail: The most recent year's tax return was not filed, and a copy of IRS Form 4868, including the amount of estimated income taxes, was not in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "No evidence second home/investment occupancy was assessed &/or red flags were not addressed" -> EXCEPTION [O-FNM-59511] Significance: Critical | AOR: Underwriter
              Exception Detail: The file did not document evidence a second home or investment property occupancy assessment was conducted by evaluating occupancy indicators such as property insurance, leases, or other loan file documentation and/or occupancy red flags were not addressed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all QC reverification and reconciliation requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q2:
          CODE: O-FHA-15291
          TEXT: Were all minimum age of credit document requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Credit documentation used to qualify were older than 120 days of the disbursement date" -> EXCEPTION [O-FHA-00546] Significance: Critical | AOR: Underwriter
              Exception Detail: Credit documents used in the origination and underwriting of the loan were older than 120 days old of the disbursement date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Updated appraisal date is over 1 yr after the effective date of the initial appraisal being updated" -> EXCEPTION [O-FHA-56210] Significance: Critical | AOR: Underwriter
              Exception Detail: The updated appraisal is dated more than 1 year after the effective date of the initial appraisal report being updated.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Initial appraisal exceeds the validity period of 180 days & an appraisal update was not obtained" -> EXCEPTION [O-FHA-00547] Significance: Critical | AOR: Underwriter
              Exception Detail: The initial appraisal exceeded the appraisal validity period of 180 days from the effective date of _x000D_
      the appraisal report and an appraisal update was not obtained.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
            - "Yes, all minimum age of credit document requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'FHA')
        Q3:
          CODE: O-RHS-14224
          TEXT: Does the file evidence any conflict or material discrepancy in credit documentation or AUS data?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "Yes, credit document(s) exceed age requirements as of the actual/scheduled closing date" -> EXCEPTION [O-RHS-02828] Significance: Critical | AOR: Underwriter
              Exception Detail: One or more of the credit and verification documents were not dated within 120 days of the closing date.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, credit document(s) used for underwriting approval appear altered/changed" -> EXCEPTION [O-RHS-02718] Significance: Critical | AOR: Underwriter
              Exception Detail: Credit qualifying documents were illegible and/or had evidence of alternations, erasures, white-outs, or similar indications that changes have been made.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, credit information conflict(s) was not investigated and resolved appropriately" -> EXCEPTION [O-RHS-02717] Significance: Critical | AOR: Underwriter
              Exception Detail: Conflicts between the credit information and other mortgage documents were not resolved and documented.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Yes, data entered into GUS is not valid" -> EXCEPTION [O-RHS-02830] Significance: Critical | AOR: Underwriter
              Exception Detail: A GUS Accept was received and contradictory, derogatory or erroneous information was discovered without the loan being resubmitted or downgraded to a Refer and manually underwritten.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "Material discrepancies in loan application and credit docs not resolved" -> EXCEPTION [O-RHS-50540] Significance: Critical | AOR: Underwriter
              Exception Detail: Material discrepancies noted between the information in the loan application and the other credit documentation were not resolved and documented in the file.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
            - "No, there is no evidence of conflict or material discrepancy in credit docs or AUS data" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'USDA')
        Q4:
          CODE: O-VA-14281
          TEXT: Does the file evidence any conflict or material discrepancy in credit documentation or AUS data?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "The credit documentation used to qualify was invalid as of the date of closing" -> EXCEPTION [O-VA-00556] Significance: Critical | AOR: Underwriter
              Exception Detail: The credit documentation used to qualify was invalid as of the date of closing.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Data entered in the AUS and considered for approval was inaccurate &/or not verified" -> EXCEPTION [O-VA-00562] Significance: Critical | AOR: Underwriter
              Exception Detail: There is data entered into the AUS considered for approval that was inaccurate and/or not verified.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "There is data entered into the AUS considered for approval that was inaccurate and/or not verified" -> EXCEPTION [O-VA-00562] Significance: Critical | AOR: Underwriter
              Exception Detail: There is data entered into the AUS considered for approval that was inaccurate and/or not verified.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Relevant documentation had corrections made that were not initialed by the appropriate party" -> EXCEPTION [O-VA-00036] Significance: Critical | AOR: Underwriter
              Exception Detail: Relevant documentation had corrections made that were not initialed by the appropriate party.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Discrepancies in credit/employ/assets/material qualifying information w/out documenting resolution" -> EXCEPTION [O-VA-00142] Significance: Critical | AOR: Underwriter
              Exception Detail: Discrepancies were noted between the credit, employment, assets or other material document used to qualify without the resolution being documented and supported.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "There is evidence in the file that loan documents signed by the borrower were blank or incomplete" -> EXCEPTION [O-VA-00008] Significance: Critical | AOR: Underwriter
              Exception Detail: There is evidence in the file that loan documents signed by the borrower were blank or incomplete.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "Int party req'd VOE, VOD, or credit reports & verification not rec'd by lender direct from verifier" -> EXCEPTION [O-VA-00006] Significance: Critical | AOR: Underwriter
              Exception Detail: In cases where the real estate broker/agent or any other party submitted a request for verification of employment, deposits, or credit reports, the verifier did not return the verification directly to the lender.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
            - "No, there is no evidence of conflict or material discrepancy in credit docs or AUS data" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'VA')
        Q5:
          CODE: O-FRD-15612
          TEXT: Were all Form 65, Uniform Residential Loan Application data integrity review requirements met?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No explanation for inconsistency from initial app to credit report identifying info or verifications" -> EXCEPTION [O-FRD-00178] Significance: Critical | AOR: Underwriter
              Exception Detail: There is conflicting information on the initial application and identifying information in the credit reports or with the verifications in the file without a written explanation being provided.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, all Form 65, Uniform Residential Loan Application data integrity review requirements were met" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
            - "Yes, final underwriting approval was granted despite unresolved material credit discrepancies" -> EXCEPTION [O-FRD-00178] Significance: Critical | AOR: Underwriter
              Exception Detail: There is conflicting information on the initial application and identifying information in the credit reports or with the verifications in the file without a written explanation being provided.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Freddie Mac')
