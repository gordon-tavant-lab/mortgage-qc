block_id: appraisal-form-1033
name: "Appraisal Form 1033 Review"
description: "Reviews Fannie Mae Form 1033 desktop appraisal reports for completeness, accuracy of property data, comparable selection, and compliance with desktop appraisal guidelines."
category: appraisal-form-1033
version: 1

parameters:
  investor:
    type: string
    default: "fnm"
    description: "Investor code"

inputs:
  - name: loan_number
    type: string
    required: true
  - name: loan_data
    type: object

outputs:
  - name: exceptions
    type: array
  - name: passes
    type: array
  - name: not_applicable
    type: array
  - name: total_checks
    type: number
  - name: critical_count
    type: number
  - name: major_count
    type: number

step_template:
  agent:
    system_prompt: |
      You are a mortgage QC auditor specializing in Appraisal Form 1033 Review. You must systematically evaluate every question in the catalog below against the loan file data.

            IMPORTANT: The loan data has been provided in your input. Use the available tools ONLY to retrieve additional data not already in your input. Do NOT re-fetch data that is already provided.

            INSTRUCTIONS:
            1. Retrieve all relevant loan data using the available tools.
            2. For EACH question in the catalog, determine which response best matches the loan file evidence.
            3. If a question's criteria field contains a SQL-like filter, evaluate whether the current loan matches that criteria. If the loan does NOT match the criteria, mark that question as NOT_APPLICABLE.
            4. If no exception response matches and the loan passes the check, select the PASS response.
            5. If the check does not apply to this loan type or scenario, select NOT_APPLICABLE.

            QUESTION CATALOG (31 questions):
        Q1:
          CODE: O-FNM-54346
          TEXT: Form 1033 #10 - Did the appraisal report identify and describe physical deficiencies that could affect a property’s safety, soundness, or structural integrity?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54346] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #10 - The appraisal report did not identify and describe physical deficiencies that could affect a property’s safety, soundness, or structural integrity.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q2:
          CODE: O-FNM-58522
          TEXT: Form 1033 #11 - Were the subject property characteristics reported accurately, including but not limited to GLA, site size, outbuildings, etc.?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-58522] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #11 - The subject property characteristics were not reported accurately, including but not limited to GLA, site size, outbuildings, etc.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "No, the subject property characteristics were not reported accurately" -> EXCEPTION [O-FNM-58522] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #11 - The subject property characteristics were not reported accurately, including but not limited to GLA, site size, outbuildings, etc.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, the subject property characteristics were accurately reported" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q3:
          CODE: O-FNM-50272
          TEXT: Form 1033 #1, #2, #3, #7 - Was the subject section of the appraisal complete and accurate including the subject property address, owner of record, county, legal description, parcel ID, as well as neighborhood and occupant information?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-50272] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #1, #2, #3, #7 - One or more of the following components was missing or incorrect in the subject section of the appraisal, the subject property address, owner of record, county and legal description, parcel ID or the neighborhood or occupant information.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q4:
          CODE: O-FNM-50284
          TEXT: Form 1033 #12 - If a review of the aerial imagery reflects that the improvements do not conform to the neighborhood, did the appraiser provide an explanation?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-50284] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #12 - A review of the aerial imagery reflects that the improvements do not conform to the neighborhood and the appraiser did not provide an explanation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The aerial imagery reflects improvements do not conform to the neighborhood with comments" -> EXCEPTION [O-FNM-50284] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #12 - A review of the aerial imagery reflects that the improvements do not conform to the neighborhood and the appraiser did not provide an explanation.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, the aerial imagery reflects that the improvements conform to the neighborhood" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q5:
          CODE: O-FNM-59379
          TEXT: Form 1033 #13 - If there is a mix of residential and non-residential properties, was it shown that the mix does not impact the value/marketability of the subject property?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-59379] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #13 - There is a mix of residential and non-residential properties without comment that the mix does not impact the value/marketability of the subject property.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q6:
          CODE: O-FNM-00534
          TEXT: Form 1033 #14 - Was it validated that the appraisal market trends were identified correctly?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          AOR_SECONDARY: Collateral Reviewer1
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-00534] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #14 - The appraisal market trends were not identified correctly.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The primary indicators of market conditions was not reported using trends in property values" -> EXCEPTION [O-FNM-00534] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #14 - The appraisal market trends were not identified correctly.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, the appraisal included primary indicators of market conditions" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q7:
          CODE: O-FNM-54534
          TEXT: Form 1033 #15 - If zoning was other than legal, did the appraiser address the ability to rebuild?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54534] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #15 - Where the zoning was other than legal, the appraiser did not address the ability to rebuild.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q8:
          CODE: O-FNM-00531
          TEXT: Form 1033 #16, #17, #18 - Were all exhibits included in the appraisal as applicable including but not limited to the building sketch or floor plan including dimensions and calculations, location map, and the required number of photographs including, the living room, family room, dining room, all bedrooms, and all finished and unfinished areas of the basement?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-00531] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #16, #17, #18 - All exhibits were not included in the appraisal as applicable including but not limited to the building sketch or floor plan including the dimensions and calculations, location map, and the required number of photographs including the living room, family room, dining room, all bedrooms, and all finished and unfinished areas of the basement.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q9:
          CODE: O-FNM-00705
          TEXT: Form 1033 #19 - Was a certification of completion/inspection provided where the appraisal is subject to completion per plans and specifications or subject to repairs or alterations?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-00705] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #19 - A certification of completion/inspection was not provided where the appraisal is subject to completion per plans and specifications or subject to repairs or alterations.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q10:
          CODE: O-FNM-53855
          TEXT: Form 1033 #20 - Were all project eligibility requirements met for the condominium project (e.g., commercial space requirements, owner occupancy, litigation, etc.)?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Project Review
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-53855] Significance: Critical | AOR: Project Review
              Exception Detail: Form 1033 #20 - All project eligibility requirements were not met for the condominium project.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae') AND (Loans.PropertyType = 'Condominium')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae') AND (Loans.PropertyType = 'Condominium')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae') AND (Loans.PropertyType = 'Condominium')
        Q11:
          CODE: O-FNM-59380
          TEXT: Form 1033 #21, #22 - As part of the collateral risk assessment analysis, was the appraisal reviewed for subjective language and/or unacceptable appraisal practices and was the appropriate exception cited? (Refer to O-FNM-57523 and/or O-FNM-57524 if an exception is applicable.)
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-59380] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #21, #22 - The appraisal was not reviewed as part of the collateral risk assessment analysis for subjective language and/or unacceptable appraisal practices with the appropriate exception cited. (O-FNM-57523 and/or O-FNM-57524 as applicable.)
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q12:
          CODE: O-FNM-59381
          TEXT: Form 1033 #23 - Was the subject property's description accurate and complete related to the subject property, and project, if applicable?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-59381] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #23 - The subject property's description was inaccurate and/or incomplete related to the subject property, and project, if applicable.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q13:
          CODE: O-FNM-50292
          TEXT: Form 1033 #24 - Did the appraiser assign the most appropriate correct condition/quality rating with report exhibits supporting the ratings, and reconcile to CU messages, if applicable on an appraisal required to be completed with the UAD?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-50292] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #24 - The appraiser didn’t assign the most appropriate correct condition/quality rating and/or the report exhibits do not support the ratings, or are not reconciled to CU messages, if applicable on an appraisal required to be completed with the UAD.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q14:
          CODE: O-FNM-59382
          TEXT: Form 1033 #25 - Where discrepancies are noted for condition, quality, and/or view/location, was the impact noted on the collateral risk assessment analysis?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-59382] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #25 - Discrepancies were noted for condition, quality, and/or view/location, and the impact was not noted on the collateral risk assessment analysis.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q15:
          CODE: O-FNM-50285
          TEXT: Form 1033 #26, #27 - Was the GLA and site size of the comparables supported and applied reasonably and consistently across all comparables?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-50285] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #26, #27 - The GLA and/or site size of the comparables were not supported and/or were not applied reasonably and consistently across all comparables.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Unique property and appraiser failed to locate recent similar comps or determine sound adjustments" -> EXCEPTION [O-FNM-50285] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #26, #27 - The GLA and/or site size of the comparables were not supported and/or were not applied reasonably and consistently across all comparables.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, appraiser located comps similar to the unique property or sound adjustments were demonstrated" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q16:
          CODE: O-FNM-59383
          TEXT: Form 1033 #28 - If the subject property has an accessory dwelling unit and/or additional site features, did the appraisal provide comparable sales with similar or consistent accessory dwelling units and/or additional site features?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-59383] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #28 - The subject property has an accessory dwelling unit and/or additional site features, and the appraisal did not provide comparable sales with similar or consistent accessory dwelling units and/or additional site features.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q17:
          CODE: O-FNM-54353
          TEXT: Form 1033 #29 - Where CU messages were present, did the lender ensure all items were resolved and provide comments explaining how they were resolved?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          AOR_SECONDARY: Collateral Reviewer1
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54353] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #29 - Where CU messages were present, the lender did not ensure all items were resolved and/or did not provide comments explaining how they were resolved.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "CU risk messages not addressed, resolved and/or was missing comments of how they were resolved" -> EXCEPTION [O-FNM-54353] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #29 - Where CU messages were present, the lender did not ensure all items were resolved and/or did not provide comments explaining how they were resolved.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all CU risk messages were addressed with comments on how they were resolved" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, all CU risk messages were address with comments on how they were resolved" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q18:
          CODE: O-FNM-54351
          TEXT: Form 1033 #30 a-b - After a review of the comparables information reported and photos, are they suitable substitutes for the subject property appealing to the same buyers?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          AOR_SECONDARY: Collateral Reviewer1
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54351] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #30 a-b - After a review of the comparables information reported and photos, the comparables do not appear to be suitable substitutes for the subject property appealing to the same buyers.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Comparables do not appear to be suitable substitutes for the property appealing to same buyers" -> EXCEPTION [O-FNM-54351] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #30 a-b - After a review of the comparables information reported and photos, the comparables do not appear to be suitable substitutes for the subject property appealing to the same buyers.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes, a review of the comparables appear suitable substitutes appealing to same buyers" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q19:
          CODE: O-FNM-50297
          TEXT: Form 1033 #30 c-d - If the appraiser’s adjusted and unadjusted prices to the comparables do not support the final value indicating that the subject may not conform to the neighborhood, was the final value adequately supported and within the range of unadjusted and/or adjusted values?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-50297] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #30 c-d - The appraiser’s adjusted and unadjusted prices to the comparables do not support the final value indicating that the subject may not conform to the neighborhood and/or was not within the unadjusted and/or adjusted range without an explanation/comment to adequately support the final value.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "No, the adjustments do not appear to conform and u/w did not determine the value is supported" -> EXCEPTION [O-FNM-50297] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #30 c-d - The appraiser’s adjusted and unadjusted prices to the comparables do not support the final value indicating that the subject may not conform to the neighborhood and/or was not within the unadjusted and/or adjusted range without an explanation/comment to adequately support the final value.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "The appraiser's adjustments appear to conform to the neighborhood" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q20:
          CODE: O-FNM-54343
          TEXT: Form 1033 #31 - If public sewer and/or water is unavailable, were community or private well and septic facilities available and utilized by the subject property, and was marketability addressed?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54343] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #31 - Public sewer and/or water is unavailable without evidence community or private well and septic facilities are available and utilized by the subject property, and/or marketability was not addressed.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
        Q21:
          CODE: O-FNM-54350
          TEXT: Form 1033 #32 - Was a minimum of 3 closed comparables provided in the sales comparison approach?
          SIGNIFICANCE: Critical
          AOR_PRIMARY: Underwriter
          AOR_SECONDARY: Collateral Reviewer1
          RESPONSES:
            - "No" -> EXCEPTION [O-FNM-54350] Significance: Critical | AOR: Underwriter
              Exception Detail: Form 1033 #32 - A minimum of 3 closed comparables was not provided in the sales comparison approach.
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Not Applicable" -> NOT_APPLICABLE
              CRITERIA: SELECT DISTINCT Loans.LoanID FROM Loans  WHERE (Loans.QC_Policy = 'Fannie Mae')
            - "Yes" -> PASS
